<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>宠物战斗动作 · 总预览</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#263b34;background:#f5f0e5}*{box-sizing:border-box}body{margin:0}header{padding:22px 28px;background:#284c40;color:#fff7df;border-bottom:3px solid #c4a966}h1{margin:0 0 8px;font-size:24px}header p{margin:0;opacity:.8}main{max-width:1500px;margin:auto;padding:20px}nav,.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}select,button,a.button{font:inherit;border:1px solid #bbaa83;border-radius:8px;background:#fffaf0;color:#294d40;padding:9px 13px;cursor:pointer}button:hover{background:#e7ecdd}button:disabled{opacity:.45;cursor:wait}a{color:#326957}#review{padding:12px 16px;border-left:4px solid #b79c59;background:#fffaf0;margin-bottom:18px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}article{background:#fffcf4;border:1px solid #dacdaf;border-radius:12px;overflow:hidden}article h2{font-size:16px;margin:0;padding:12px 16px;background:#e6eadc;display:flex;justify-content:space-between}.stage{position:relative;aspect-ratio:1;background:conic-gradient(#f5f3ed 25%,#e6e4de 0 50%,#f5f3ed 0 75%,#e6e4de 0) 0 0/28px 28px}.stage img{width:100%;height:100%;object-fit:contain;display:block}.stage .missing{position:absolute;inset:0;display:grid;place-items:center;background:#fff2e9;color:#9b4734}.stage .missing[hidden]{display:none}.row{display:flex;gap:8px;padding:10px;align-items:center}.row input{width:100%;min-width:30px}.row button{padding:5px 9px}.counter{font-variant-numeric:tabular-nums;min-width:64px;font-size:13px}footer{margin:24px 0;color:#657169;font-size:13px}body.dark .stage{background:#21362e}body.white .stage{background:white}@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:570px){.grid{grid-template-columns:1fr}header,main{padding:14px}}
</style>
<header><h1>宠物战斗动作</h1><p>Image 原有形象 · 受击 / 普攻 / 施法 · E 斜前 / W 斜后</p></header>
<main><nav><label>选择宠物 <select id="pet"></select></label><span id="total"></span><a href="README.md">交付总表</a></nav>
<div class="tools"><button id="play" disabled>暂停</button><label>速度 <select id="speed"><option value="1">正常 1×</option><option value="0.25">慢放 0.25×</option></select></label><label>背景 <select id="background"><option value="">透明棋盘</option><option value="dark">深色</option><option value="white">白色</option></select></label><button id="reset">回到首帧</button><span id="loading" aria-live="polite"></span></div>
<div id="review"></div><div id="links" class="tools"></div><section class="grid" id="grid"></section><footer id="foot"></footer></main>
<script>
'use strict';
const DATA=__DATA__;
const $=id=>document.getElementById(id);let cards=[],playing=true,speed=1,last=null,token=0,ready=false;
DATA.entries.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=p.name+' · '+p.present+'/68';$('pet').append(o)});
$('total').textContent='全批 '+DATA.presentFrames+' / '+DATA.expectedFrames+' 张';
function draw(c){const f=c.g.frames[c.frame];c.img.src=f.url;c.missing.hidden=f.exists&&f.loaded!==false;c.missing.textContent='第 '+(c.frame+1)+' 帧缺失或加载失败';c.slider.value=c.frame;c.counter.textContent=(c.frame+1)+' / '+c.g.frames.length}
function setPlaying(v){playing=v;last=null;$('play').textContent=v?'暂停':'播放'}
function step(c,amount){setPlaying(false);c.frame=(c.frame+amount+c.g.frames.length)%c.g.frames.length;c.elapsed=0;draw(c)}
async function selectPet(){const my=++token;ready=false;setPlaying(true);last=null;$('play').disabled=true;$('grid').replaceChildren();cards=[];const p=DATA.entries[Number($('pet').value)];$('review').textContent=p.name+'：'+p.review.note+'。正式图片 '+p.present+'/68；数量齐全不代表验收通过。';$('links').replaceChildren();for(const [label,url]of [...Object.entries(p.docs),...(p.preview?[['单只预览',p.preview]]:[])]){const a=document.createElement('a');a.href=url;a.textContent=label;$('links').append(a)}
const pending=[];for(const g of p.groups){const a=document.createElement('article');const h=document.createElement('h2');h.textContent=g.label+' '+g.direction;const timing=document.createElement('span');timing.textContent=g.durationMs+' ms/帧';h.append(timing);const stage=document.createElement('div');stage.className='stage';const img=document.createElement('img');img.alt=p.name+' '+g.label+' '+g.direction;const missing=document.createElement('div');missing.className='missing';missing.hidden=true;stage.append(img,missing);const row=document.createElement('div');row.className='row';const prev=document.createElement('button');prev.textContent='‹';prev.title='上一帧';const next=document.createElement('button');next.textContent='›';next.title='下一帧';const slider=document.createElement('input');slider.type='range';slider.min=0;slider.max=g.frames.length-1;slider.value=0;slider.setAttribute('aria-label',g.label+' '+g.direction+' 帧');const counter=document.createElement('span');counter.className='counter';const c={g,img,missing,slider,counter,frame:0,elapsed:0};prev.onclick=()=>step(c,-1);next.onclick=()=>step(c,1);slider.oninput=()=>{setPlaying(false);c.frame=Number(slider.value);c.elapsed=0;draw(c)};img.onerror=()=>{missing.hidden=false;missing.textContent='第 '+(c.frame+1)+' 帧未能加载'};row.append(prev,slider,next,counter);a.append(h,stage,row);$('grid').append(a);cards.push(c);draw(c);for(const f of g.frames)if(f.exists)pending.push(new Promise(resolve=>{const im=new Image();im.onload=()=>{f.loaded=true;resolve(true)};im.onerror=()=>{f.loaded=false;resolve(false)};im.src=f.url}))}
$('loading').textContent='正在加载全部动作…';const ok=await Promise.all(pending);if(my!==token)return;$('loading').textContent='已加载 '+ok.filter(Boolean).length+'/'+pending.length;$('play').disabled=false;ready=true;last=null;cards.forEach(draw);$('foot').textContent='统计时间 '+DATA.builtAtUTC+' · 原速时长：受击240ms，普攻360ms，施法720ms。客户端未接入。'}
function tick(now){if(ready&&playing&&last!==null){const dt=Math.max(0,now-last)*speed;for(const c of cards){c.elapsed+=dt;const advance=Math.floor(c.elapsed/c.g.durationMs);if(advance){c.elapsed%=c.g.durationMs;c.frame=(c.frame+advance)%c.g.frames.length;draw(c)}}}last=now;requestAnimationFrame(tick)}
$('pet').onchange=selectPet;$('play').onclick=()=>setPlaying(!playing);$('speed').onchange=()=>{speed=Number($('speed').value);last=null};$('background').onchange=()=>{document.body.className=$('background').value};$('reset').onclick=()=>{cards.forEach(c=>{c.frame=0;c.elapsed=0;draw(c)});last=null};document.addEventListener('visibilitychange',()=>{last=null});selectPet();requestAnimationFrame(tick);
</script></html>
