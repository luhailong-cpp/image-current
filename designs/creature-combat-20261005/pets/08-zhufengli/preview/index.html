<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>竹风狸 · 战斗动作验看</title>
<style>body{margin:0;background:#122822;color:#efe5cd;font:16px system-ui}header{padding:18px 26px;background:#1c3c33;position:sticky;top:0;z-index:2}h1{font-size:24px;margin:0 0 10px}button,select{background:#e8debd;color:#193f31;border:0;border-radius:6px;padding:9px 14px;margin-right:8px;cursor:pointer}main{padding:20px;display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:18px}article{border:1px solid #789787;border-radius:12px;overflow:hidden;background:#203b32}h2{font-size:18px;margin:12px 16px}canvas{width:100%;height:auto;display:block;background-color:#c3cbc7;background-image:linear-gradient(45deg,#aab5ad 25%,transparent 25%),linear-gradient(-45deg,#aab5ad 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#aab5ad 75%),linear-gradient(-45deg,transparent 75%,#aab5ad 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}.controls{padding:12px}.controls button{padding:6px 10px}input{width:100%}output{display:block;font:14px monospace;margin:8px 0}p{margin:6px 0;font-size:14px;color:#ccd9ca}a{color:#e8d69a}body.single main{grid-template-columns:1fr;max-width:800px;margin:auto}body.single header{position:static}body.dark canvas{background:#11221e}body.light canvas{background:#f4eedb}@media(max-width:950px){main{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){main{grid-template-columns:1fr}}</style>
<header><h1>竹风狸 · 受击 / 普攻 / 施法</h1><button id="playAll">全部播放</button><button id="pauseAll">全部暂停</button><select id="speed" aria-label="播放速度"><option value="1">正常速度 1×</option><option value="0.25">慢放 0.25×</option></select><select id="bg" aria-label="背景"><option value="checker">透明棋盘</option><option value="dark">深色背景</option><option value="light">浅色背景</option></select><p>E 斜前朝右下 · W 斜后朝左上｜受击 6×40ms，普攻 12×30ms，施法 16×45ms。每张为独立 AI 姿态。客户端未接入。</p><p id="summary"></p></header><main id="groups"></main><script src="data.js"></script><script>
const params=new URLSearchParams(location.search),chosen=params.get('group');if(chosen)document.body.classList.add('single');const states=[];let rate=1;const labels={hit:'受击',attack:'普攻',cast:'施法'};
for(const g of GROUPS){const key=g.action+'-'+g.direction;if(chosen&&chosen!==key)continue;const a=document.createElement('article');a.dataset.group=key;a.innerHTML=`<h2>${labels[g.action]} · ${g.direction} <small>${g.frames.length}/${g.expected} 帧</small></h2><canvas width="1024" height="1024"></canvas><div class="controls"><button class="play">播放</button><button class="prev">上一帧</button><button class="next">下一帧</button><output>加载中</output><input aria-label="${key}逐帧" type="range" min="1" max="${Math.max(1,g.frames.length)}" value="1"><p><a href="?group=${key}">独立放大预览</a> · <a href="${key}-contact.jpg">全帧图</a></p></div>`;document.querySelector('main').append(a);const s={g,key,el:a,ctx:a.querySelector('canvas').getContext('2d'),images:[],index:0,playing:false,base:0,painted:[],ready:false};states.push(s);
Promise.all(g.frames.map(f=>new Promise(resolve=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>resolve(null);im.src='../'+f.file;}))).then(imgs=>{s.images=imgs;s.ready=true;paint(s)});
a.querySelector('.play').onclick=()=>{s.playing=!s.playing;s.base=performance.now()-s.index*g.durationMs/rate;a.querySelector('.play').textContent=s.playing?'暂停':'播放'};a.querySelector('.prev').onclick=()=>step(s,-1);a.querySelector('.next').onclick=()=>step(s,1);a.querySelector('input').oninput=e=>{s.playing=false;s.index=+e.target.value-1;paint(s)};
}
function paint(s){if(!s.ready||!s.images.length)return;s.ctx.clearRect(0,0,1024,1024);if(s.images[s.index])s.ctx.drawImage(s.images[s.index],0,0);s.el.querySelector('input').value=s.index+1;s.el.querySelector('output').value=`${s.key} ${s.index+1}/${s.g.frames.length} · ${s.g.durationMs}ms · ${rate}×`;s.el.dataset.frame=s.index+1;s.painted.push({frame:s.index+1,at:performance.now()});if(s.painted.length>400)s.painted.shift();}
function step(s,d){s.playing=false;s.index=(s.index+d+s.images.length)%s.images.length;paint(s)}
function tick(now){for(const s of states)if(s.playing&&s.ready){const i=Math.floor((now-s.base)*rate/s.g.durationMs)%s.images.length;if(i!==s.index){s.index=i;paint(s)}}requestAnimationFrame(tick)}requestAnimationFrame(tick);
document.querySelector('#playAll').onclick=()=>states.forEach(s=>{s.playing=true;s.base=performance.now()-s.index*s.g.durationMs/rate;s.el.querySelector('.play').textContent='暂停'});document.querySelector('#pauseAll').onclick=()=>states.forEach(s=>{s.playing=false;s.el.querySelector('.play').textContent='播放'});document.querySelector('#speed').onchange=e=>{rate=+e.target.value;states.forEach(s=>{s.base=performance.now()-s.index*s.g.durationMs/rate;paint(s)})};document.querySelector('#bg').onchange=e=>{document.body.classList.remove('dark','light');if(e.target.value!=='checker')document.body.classList.add(e.target.value)};
document.querySelector('#summary').textContent=`当前预览 ${GROUPS.reduce((s,g)=>s+g.frames.length,0)} / 68 张；单帧检查与完整连播验收记录以 qa/visual-review.json 为准。`;
window.previewAudit=()=>states.map(s=>({group:s.key,ready:s.ready,loaded:s.images.filter(Boolean).length,playing:s.playing,rate,frame:s.index+1,painted:s.painted}));
</script></html>
