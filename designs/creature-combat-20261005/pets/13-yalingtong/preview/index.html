<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>芽铃童 · 战斗动作检视</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e7e9e1;color:#203d32;font:16px system-ui}h1{margin:0 0 6px}p{margin:8px 0 18px}.toolbar{position:sticky;top:0;padding:12px;background:#f9f6ec;z-index:2;border:1px solid #bbc5b5;border-radius:12px;display:flex;gap:10px;flex-wrap:wrap}button,select{font:inherit;border:1px solid #80988a;border-radius:8px;padding:7px 14px;background:#fffdf5;color:#214c3a;cursor:pointer}main{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:18px;margin-top:20px}.panel{background:#f8f7ef;border:1px solid #afbfac;border-radius:14px;padding:14px}.stage{aspect-ratio:1;background:repeating-conic-gradient(#d5ddd1 0% 25%,#e5eade 0% 50%) 50%/28px 28px;position:relative;border-radius:8px}.stage canvas{width:100%;height:100%;object-fit:contain}.anchor{position:absolute;left:50%;top:92%;width:14px;height:14px;border:1px solid #b55b37;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}h2{font-size:20px;margin:0 0 8px}.controls{display:flex;gap:8px;align-items:center;margin-top:12px}.controls input{width:100%}output{font-variant-numeric:tabular-nums;white-space:nowrap}.contact{display:block;margin-top:10px;color:#356249}#status{margin-left:auto}body.dark .stage{background:#26372f}body.white .stage{background:white}@media(max-width:1050px){main{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){main{grid-template-columns:1fr}}</style>
<h1>芽铃童 · 受击 / 普攻 / 施法</h1><p>E 斜前朝右下 · W 斜后朝左上 · 原地战斗 · 1024 透明 PNG</p><div class="toolbar"><button id="play">暂停</button><button id="normal">正常 1×</button><button id="slow">慢放 0.25×</button><button id="reset">各组首帧</button><select id="bg" aria-label="背景"><option value="">透明棋盘</option><option value="dark">深底</option><option value="white">白底</option></select><span id="status">正在载入</span></div><main id="main"></main>
<script src="data.js"></script><script>
let speed=1,playing=true,last=0,ready=false;const panels=[];const names={hit:'受击',attack:'普攻',cast:'施法'};let loaded=0,failed=0;const jobs=[];
for(const g of SPRITE_MANIFEST.groups){const p=document.createElement('section');p.className='panel';p.innerHTML=`<h2>${names[g.action]} ${g.direction} · ${g.durationMs}ms/帧</h2><div class="stage"><canvas width="1024" height="1024" aria-label="${g.action} ${g.direction}"></canvas><span class="anchor"></span></div><div class="controls"><button aria-label="${g.action} ${g.direction} 上一帧">‹</button><input type="range" aria-label="${g.action} ${g.direction} 帧" min="1" max="${g.expectedCount}" value="1"><button aria-label="${g.action} ${g.direction} 下一帧">›</button><output></output></div><a class="contact" href="${g.action}-${g.direction}-all-frames.jpg">逐帧总览</a>`;main.append(p);const ps={g,el:p,canvas:p.querySelector('canvas'),lastDrawn:-1,range:p.querySelector('input'),out:p.querySelector('output'),phase:0,index:0,sources:[],displayed:new Set()};panels.push(ps);for(const f of g.frames){const im=new Image();im.src='../'+f.file+'?sha='+f.sha256;ps.sources.push(im);jobs.push(im.decode().then(()=>loaded++).catch(()=>failed++))}function step(d){playing=false;play.textContent='播放';ps.index=(ps.index+d+ps.sources.length)%ps.sources.length;ps.phase=ps.index*g.durationMs;render(ps)}p.querySelectorAll('button')[0].onclick=()=>step(-1);p.querySelectorAll('button')[1].onclick=()=>step(1);ps.range.oninput=()=>{playing=false;play.textContent='播放';ps.index=+ps.range.value-1;ps.phase=ps.index*g.durationMs;render(ps)};}
function render(p){const s=p.sources[p.index];if(s){if(p.lastDrawn!==p.index){const c=p.canvas.getContext('2d');c.clearRect(0,0,1024,1024);c.drawImage(s,0,0);p.lastDrawn=p.index}p.displayed.add(p.index+1)}p.range.value=p.index+1;p.out.value=`${p.index+1}/${p.g.expectedCount}`;p.el.dataset.frame=p.index+1;p.el.dataset.displayed=[...p.displayed].join(',')}
play.onclick=()=>{playing=!playing;play.textContent=playing?'暂停':'播放'};normal.onclick=()=>{speed=1;playing=true;play.textContent='暂停'};slow.onclick=()=>{speed=.25;playing=true;play.textContent='暂停'};reset.onclick=()=>{playing=false;play.textContent='播放';for(const p of panels){p.phase=0;p.index=0;render(p)}};bg.onchange=()=>document.body.className=bg.value;
Promise.all(jobs).then(()=>{ready=true;for(const p of panels)render(p)});function tick(t){const dt=last?t-last:0;last=t;if(ready&&playing){for(const p of panels){p.phase=(p.phase+dt*speed)%(p.g.durationMs*p.sources.length);p.index=Math.floor(p.phase/p.g.durationMs);render(p)}}document.getElementById('status').textContent=`${loaded}/68 已载入 · ${failed} 错误 · ${playing?'连播':'逐帧'} ${speed}×`;requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
