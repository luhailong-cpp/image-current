<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>赤砂魁 · 战斗动作预览</title><style>*{box-sizing:border-box}body{margin:24px;background:#17262b;color:#efefda;font:16px system-ui}h1{font-size:24px}header{display:flex;align-items:center;gap:20px;flex-wrap:wrap}button,select,input{accent-color:#8fc7ae}button,select{padding:8px 14px;border-radius:8px;background:#dbe6d7;color:#213f35;border:0}main{display:grid;grid-template-columns:repeat(2,minmax(400px,1fr));gap:20px}.card{padding:16px;border:1px solid #658074;border-radius:12px;background:#20353a}.pair{display:flex;gap:10px}.view{flex:1;min-width:0}canvas{width:100%;display:block;background-color:#52605b;background-image:linear-gradient(45deg,#607068 25%,transparent 25%),linear-gradient(-45deg,#607068 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#607068 75%),linear-gradient(-45deg,transparent 75%,#607068 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}small{display:block;color:#b7cfc2;margin:5px}input[type=range]{width:100%}.readout{font-variant-numeric:tabular-nums}footer{margin:20px;color:#bad1c6}@media(max-width:950px){main{grid-template-columns:1fr}}</style><header><h1>赤砂魁 · 受击 / 普攻 / 施法</h1><button id="toggle">全部暂停</button><button id="reset">从首帧播放</button><label>背景 <select id="bg"><option value="check">棋盘</option><option value="#f1eee2">浅色</option><option value="#182326">深色</option></select></label></header><p>左侧原速，右侧 0.25 倍。暂停保留两侧各自进度；滑块、上一帧/下一帧或左右键同步选择一帧。客户端未接入。</p><main id="cards"></main><footer id="status"></footer><script id="manifest" type="application/json">__DATA__</script><script src="playback-state.js"></script><script src="player.js"></script></html>
