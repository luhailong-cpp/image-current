<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>葫团团 W 施法验收</title><style>body{font-family:system-ui;background:#ece8dc;color:#193c31;margin:24px}button,select,input{font:inherit;margin:5px;padding:8px}canvas{background:repeating-conic-gradient(#d4d4cd 0% 25%,#ecece6 0% 50%) 0/32px 32px;max-width:75vh;max-height:75vh;border:1px solid #888}img{width:min(100%,1280px)}p{margin:8px}</style><h1>葫团团 W 施法 · 16 帧 × 45 ms</h1><p>固定完整画布，不做逐帧对齐。红十字为名义锚点 (512,942)。</p><button id="play">播放</button><button id="pause">暂停</button><button id="prev">上一帧</button><button id="next">下一帧</button><select id="speed"><option value="1">正常速度</option><option value="0.25">0.25 慢放</option></select><input id="seek" type="range" min="1" max="16" value="1"><b id="readout">01 / 16</b><p><canvas id="screen" width="1024" height="1024"></canvas></p><details><summary>逐帧总览</summary><img src="../contact-cast-W.png"></details><script>
const images=Array.from({length:16},(_,i)=>{const im=new Image;im.src='../../runtime/cast/W/'+String(i+1).padStart(2,'0')+'.png';return im});const c=document.querySelector('canvas'),g=c.getContext('2d'),seek=document.querySelector('#seek'),readout=document.querySelector('#readout');let frame=0,playing=false,start=0,startFrame=0;function draw(){g.clearRect(0,0,1024,1024);if(images[frame].complete)g.drawImage(images[frame],0,0);g.strokeStyle='#c90000';g.beginPath();g.moveTo(502,942);g.lineTo(522,942);g.moveTo(512,932);g.lineTo(512,952);g.stroke();seek.value=frame+1;readout.textContent=String(frame+1).padStart(2,'0')+' / 16';document.body.dataset.frame=frame+1;document.body.dataset.playing=playing;}function tick(t){if(playing){frame=(startFrame+Math.floor((t-start)*Number(document.querySelector('#speed').value)/45))%16;draw()}requestAnimationFrame(tick)}document.querySelector('#play').onclick=()=>{playing=true;start=performance.now();startFrame=frame;draw()};document.querySelector('#pause').onclick=()=>{playing=false;draw()};document.querySelector('#prev').onclick=()=>{playing=false;frame=(frame+15)%16;draw()};document.querySelector('#next').onclick=()=>{playing=false;frame=(frame+1)%16;draw()};seek.oninput=()=>{playing=false;frame=Number(seek.value)-1;draw()};document.querySelector('#speed').onchange=()=>{start=performance.now();startFrame=frame};images.forEach(im=>im.onload=draw);draw();requestAnimationFrame(tick);
</script></html>
