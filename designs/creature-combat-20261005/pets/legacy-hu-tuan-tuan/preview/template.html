<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>葫团团 · 六组战斗动作验收</title>
<style>
:root{font:15px/1.5 system-ui,sans-serif;color:#e9ecdf;background:#182822;color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:24px;max-width:1600px;margin:auto}h1{font-size:28px;margin:0 0 8px}p{margin:6px 0 14px;color:#c7d4c3}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:#284036;padding:14px;border-radius:12px;margin:20px 0;position:sticky;top:6px;z-index:3}button,select{font:inherit;border:1px solid #7b9d81;border-radius:7px;padding:6px 12px;background:#345746;color:#f5f6ed;cursor:pointer}button:hover{background:#477458}label{display:flex;gap:6px;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}.card{background:#243b31;border:1px solid #4e7059;border-radius:14px;overflow:hidden}.head{padding:12px 16px;display:flex;justify-content:space-between}.stage{aspect-ratio:1;position:relative;background-color:#efefdc;background-image:linear-gradient(45deg,#d8dcc7 25%,transparent 25%),linear-gradient(-45deg,#d8dcc7 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d8dcc7 75%),linear-gradient(-45deg,transparent 75%,#d8dcc7 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.anchor{position:absolute;left:50%;top:91.9921875%;width:16px;height:16px;transform:translate(-50%,-50%);z-index:1;pointer-events:none}.anchor:before,.anchor:after{content:"";position:absolute;background:#b32155}.anchor:before{width:16px;height:1px;top:8px}.anchor:after{width:1px;height:16px;left:8px}.missing{position:absolute;inset:0;display:grid;place-content:center;color:#a72b2b;font-weight:700}.controls{padding:12px 16px}.controls input{width:100%;margin:12px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.counter{font-variant-numeric:tabular-nums;margin-left:auto}a{color:#d7df93}.issues{padding:12px;background:#2f4032;border-radius:10px;margin:18px 0}.badge{font-size:13px;color:#e9d596}.sheets{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:20px;margin-top:20px}.sheets img{width:100%;height:auto;border-radius:7px}summary{cursor:pointer}code{word-break:break-all}footer{margin-top:30px;color:#b9c9b5}.drop{color:#eaa799}
[hidden]{display:none!important}
.stage.dark{background-image:none;background-color:#101816}.stage.light{background-image:none;background-color:#faf8ef}
</style>
<h1>葫团团 · 战斗动作检查</h1>
<p>完整 1024 画布直接播放；固定脚点十字为 [512, 942]。E 为右下斜正面，W 为左上真实斜背面。缩略图与播放器均不按每帧包围盒对齐。</p>
<div class="toolbar"><button id="all">全部播放</button><button id="reset">全部回到第 1 帧</button><label>速度 <select id="speed"><option value="1">正常 1×</option><option value="0.25">慢放 0.25×</option></select></label><label>背景 <select id="background"><option value="checker">棋盘格</option><option value="dark">深色</option><option value="light">浅色</option></select></label><label><input type="checkbox" id="anchors" checked>显示固定脚点</label><span class="badge">客户端未接入；视觉检查范围见下方记录</span></div>
<div id="issues" class="issues"></div><main class="grid" id="grid"></main>
<details style="margin-top:24px"><summary>六组全部帧接触表</summary><div id="sheets" class="sheets"></div></details>
<footer>技术检查核对尺寸、Alpha、SHA、缺帧、像素完全重复和逐图来源引用。它无法证明关节、尾巴、持物、支撑、方向或动作衔接正确。</footer>
<script>
const report=__MANIFEST_JSON__;
const labels={hit:'受击',attack:'普攻',cast:'施法'};
const state=[];let speed=1;let allPlaying=false;
const issue=document.querySelector('#issues');const v=report.verification;
issue.textContent=`正式帧 ${v.presentFrames} / ${v.expectedFrames}；技术检查 ${v.technicalPassed?'通过':'未通过'}；错误 ${v.errors.length}；来源提示 ${v.warnings.length}。${v.visualReviewRecord?'逐帧与浏览器播放抽样已复核；详见验收记录。':'视觉和连播状态：待复核。'}`;
for(const pending of v.unresolvedVisualIssues||[]){const p=document.createElement('p');p.className='drop';p.textContent=`动态验收待修：${pending.finding} ${pending.currentDecision}`;issue.append(p)}
if(v.errors.length||v.warnings.length){const d=document.createElement('details');const s=document.createElement('summary');s.textContent='查看技术检查明细';d.append(s);const ul=document.createElement('ul');for(const value of [...v.errors,...v.warnings]){const li=document.createElement('li');li.textContent=value;ul.append(li)}d.append(ul);issue.append(d)}
function render(st){const f=st.frames[st.index];if(f.exists){const next=st.loaded[st.index];if(st.image!==next){st.image.replaceWith(next);st.image=next}}st.image.hidden=!f.exists;st.missing.hidden=f.exists;st.counter.textContent=`${st.index+1} / ${st.frames.length}`;st.slider.value=st.index;st.filename.textContent=f.file;st.play.textContent=st.playing?'暂停':'播放';st.frameStarted=performance.now()}
function setPlaying(st,on){st.playing=on;st.frameStarted=performance.now();st.play.textContent=on?'暂停':'播放'}
for(const action of ['hit','attack','cast'])for(const direction of ['E','W']){
 const frames=report.frames.filter(f=>f.action===action&&f.direction===direction);const card=document.createElement('section');card.className='card';
 card.innerHTML=`<div class="head"><strong>${labels[action]} · ${direction}</strong><span>${frames.length} 帧 × ${frames[0].durationMs} ms</span></div><div class="stage"><img alt="${action} ${direction} 当前帧"><div class="missing">缺少正式帧</div><div class="anchor"></div></div><div class="controls"><div class="row"><button class="prev">上一帧</button><button class="play">播放</button><button class="next">下一帧</button><span class="counter"></span></div><input type="range" min="0" max="${frames.length-1}" value="0" step="1" aria-label="逐帧滑块"><div><code class="filename"></code></div><div class="drop"></div><a href="contact-${action}-${direction}.png">打开全帧接触表</a></div>`;
 document.querySelector('#grid').append(card);const st={frames,index:0,playing:false,image:card.querySelector('img'),missing:card.querySelector('.missing'),counter:card.querySelector('.counter'),slider:card.querySelector('input'),filename:card.querySelector('.filename'),play:card.querySelector('.play'),frameStarted:0,drop:card.querySelector('.drop'),delays:0};st.loaded=frames.map(f=>{const img=new Image();img.alt=action+' '+direction+' 当前帧';if(f.exists)img.src='../'+f.file+'?v='+f.sha256;return img});state.push(st);
 st.play.onclick=()=>setPlaying(st,!st.playing);card.querySelector('.prev').onclick=()=>{setPlaying(st,false);st.index=(st.index+frames.length-1)%frames.length;render(st)};card.querySelector('.next').onclick=()=>{setPlaying(st,false);st.index=(st.index+1)%frames.length;render(st)};st.slider.oninput=()=>{setPlaying(st,false);st.index=Number(st.slider.value);render(st)};render(st);
 // Retain decoded frame elements and switch them without resetting URLs on every tick.
 const figure=document.createElement('figure');figure.innerHTML=`<figcaption>${labels[action]} · ${direction}</figcaption><a href="contact-${action}-${direction}.png"><img loading="lazy" alt="${action} ${direction} 全部帧" src="contact-${action}-${direction}.png"></a>`;document.querySelector('#sheets').append(figure)
}
document.querySelector('#all').onclick=()=>{allPlaying=!allPlaying;state.forEach(st=>setPlaying(st,allPlaying));document.querySelector('#all').textContent=allPlaying?'全部暂停':'全部播放'};
document.querySelector('#reset').onclick=()=>{allPlaying=false;document.querySelector('#all').textContent='全部播放';state.forEach(st=>{setPlaying(st,false);st.index=0;st.delays=0;st.drop.textContent='';render(st)})};
document.querySelector('#speed').onchange=e=>{speed=Number(e.target.value);state.forEach(st=>st.frameStarted=performance.now())};
document.querySelector('#anchors').onchange=e=>document.querySelectorAll('.anchor').forEach(el=>el.hidden=!e.target.checked);
document.querySelector('#background').onchange=e=>document.querySelectorAll('.stage').forEach(el=>{el.classList.toggle('dark',e.target.value==='dark');el.classList.toggle('light',e.target.value==='light')});
// Keep every pose visible, never interpolate or omit frames. When the browser
// cannot maintain cadence, report delay instead of claiming accurate playback.
function tick(now){for(const st of state){if(!st.playing)continue;const duration=st.frames[st.index].durationMs/speed;const elapsed=now-st.frameStarted;if(elapsed>=duration){const lateness=elapsed-duration;if(lateness>20){st.delays++;st.drop.textContent=`浏览器计时延迟 ${st.delays} 次，建议单组或慢速复查`}st.index=(st.index+1)%st.frames.length;const prior=st.frameStarted;render(st);st.frameStarted=lateness>duration?now:prior+duration}}requestAnimationFrame(tick)}requestAnimationFrame(tick);
document.addEventListener('visibilitychange',()=>{if(document.hidden){state.forEach(st=>setPlaying(st,false));allPlaying=false;document.querySelector('#all').textContent='全部播放'}});
</script>
</html>
