<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>葫团团 · E 向施法</title><style>body{margin:24px;background:#203236;color:#f4ecdb;font:16px system-ui}main{max-width:780px;margin:auto}canvas{display:block;width:min(74vh,100%);height:auto;background:repeating-conic-gradient(#314448 0% 25%,#293d41 0% 50%) 0 0/28px 28px;border:1px solid #718081}button,select,input{margin:8px 6px 8px 0;font:inherit}button,select{padding:8px 12px}input{width:min(90%,520px)}a{color:#e6c37e}p{line-height:1.6}</style><main><h1>葫团团 · E 向施法</h1><p>16 帧 × 45 ms · 正常速度 720 ms · 0.25 倍慢速 2880 ms</p><canvas id="stage" width="1024" height="1024"></canvas><div><button id="play">暂停</button><button id="prev">上一帧</button><button id="next">下一帧</button><select id="speed"><option value="1">正常 1×</option><option value="0.25">慢放 0.25×</option></select><output id="info"></output></div><input id="seek" type="range" min="1" max="16" step="1" value="1"><p><a href="../preview/contact-cast-E.png">逐帧总览</a> · <a href="cast-E-report.json">技术与单帧检查记录</a></p><p>固定画布展示正式文件；无逐帧位置修正。此预览未接入客户端。</p></main><script>const imgs=Array.from({length:16},(_,i)=>{let im=new Image();im.src=`../runtime/cast/E/${String(i+1).padStart(2,'0')}.png`;return im});const cv=document.querySelector('#stage'),ctx=cv.getContext('2d'),seek=document.querySelector('#seek'),info=document.querySelector('#info'),play=document.querySelector('#play'),speed=document.querySelector('#speed');let index=0,playing=true,last=0;function render(){ctx.clearRect(0,0,1024,1024);ctx.drawImage(imgs[index],0,0);seek.value=index+1;info.textContent=`${String(index+1).padStart(2,'0')} / 16`;}function pause(){playing=false;play.textContent='播放';}function tick(t){if(playing&&t-last>=45/Number(speed.value)){index=(index+1)%16;render();last=t;}requestAnimationFrame(tick);}play.onclick=()=>{playing=!playing;play.textContent=playing?'暂停':'播放';last=performance.now();};document.querySelector('#prev').onclick=()=>{pause();index=(index+15)%16;render();};document.querySelector('#next').onclick=()=>{pause();index=(index+1)%16;render();};seek.oninput=()=>{pause();index=Number(seek.value)-1;render();};speed.onchange=()=>last=performance.now();Promise.all(imgs.map(im=>im.decode())).then(()=>{render();requestAnimationFrame(tick);});</script></html>
