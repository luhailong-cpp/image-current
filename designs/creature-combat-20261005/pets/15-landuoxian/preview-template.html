<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>岚铎仙 · 战斗动作验收</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf1e9;color:#16352d;font:15px system-ui}header{padding:20px 24px;background:#143d34;color:#fff7dd}h1{font-size:23px;margin:0 0 8px}header p{margin:5px 0;opacity:.85}.tools{position:sticky;top:0;z-index:5;padding:12px 24px;background:#e2eadc;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{font:inherit;border:1px solid #849e8d;border-radius:7px;background:#fffdf5;padding:7px 12px;color:#16352d;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,minmax(280px,1fr));gap:16px;padding:20px}article{background:#fffdf5;border:1px solid #b4c4b1;border-radius:12px;overflow:hidden}h2{font-size:17px;margin:12px 15px}.stage{aspect-ratio:1;background:repeating-conic-gradient(#e5e9e4 0% 25%,#f4f5f1 0% 50%) 50%/24px 24px;position:relative}.stage canvas{width:100%;height:100%;object-fit:contain}.stage:after{content:'+';position:absolute;left:50%;top:92%;font:bold 16px monospace;color:#ce5549;pointer-events:none}.controls{padding:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.controls input{width:100%}.counter{margin-left:auto;font-variant-numeric:tabular-nums}.footer{padding:0 24px 30px;color:#59705d}body.dark .stage{background:#203631}body.white .stage{background:white}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(250px,1fr))}}@media(max-width:600px){.grid{grid-template-columns:1fr}}article.focus{grid-column:1/-1;max-width:850px;width:100%;justify-self:center}</style>
<header><h1>岚铎仙 · 受击 / 普攻 / 施法</h1><p>E 斜前朝右下 · W 真斜后朝左上 · 68 帧合同 · 1024 透明 PNG</p><p>右手三玉铎金框 · 左手玉槌 · 原地动作。预览用于素材审查，客户端尚未接入。</p></header>
<div class="tools"><button id="allplay">全部播放</button><button id="allpause">全部暂停</button><label>速度 <select id="speed"><option value="1">正常 1×</option><option value="0.25">慢放 0.25×</option></select></label><label>背景 <select id="bg"><option value="">棋盘</option><option value="dark">深绿</option><option value="white">白色</option></select></label><span id="loaded">图片加载中</span></div><main class="grid" id="grid"></main><p class="footer">每组独立播放、暂停、前后帧及滑杆。点击“放大”看单组；单帧操作会暂停该组。红色十字为目标脚点 [512,942]。所有播放直接使用正式 PNG，未插值补帧。</p>
<script>const groups=__GROUP_DATA__;let speed=1;const states=[];let failures=0,loaded=0;const total=groups.reduce((n,g)=>n+g.frames.length,0);for(const g of groups){const article=document.createElement('article');article.innerHTML=`<h2>${g.id} · ${g.frames.length}/${g.expectedFrames}帧 · ${g.durationMs}ms/帧</h2><div class="stage"><canvas width="1024" height="1024" role="img" aria-label="${g.id} 动作帧"></canvas></div><div class="controls"><button class="play">暂停</button><button class="prev">前帧</button><button class="next">后帧</button><button class="focus">放大</button><span class="counter"></span><input aria-label="${g.id}逐帧" type="range" min="1" max="${Math.max(1,g.frames.length)}" value="1"></div>`;document.querySelector('#grid').append(article);const s={g,article,index:0,playing:true,elapsed:0,last:0,images:[]};for(const f of g.frames){const img=new Image;img.onload=()=>{loaded++;document.querySelector('#loaded').textContent=`已加载 ${loaded}/${total} · 错误 ${failures}`};img.onerror=()=>{failures++;document.querySelector('#loaded').textContent=`已加载 ${loaded}/${total} · 错误 ${failures}`};img.src='../'+f.file;s.images.push(img)}s.draw=()=>{if(!g.frames.length)return;const can=article.querySelector('canvas'),ctx=can.getContext('2d'),img=s.images[s.index];if(img.complete&&img.naturalWidth&&s.lastDrawn!==s.index){ctx.clearRect(0,0,1024,1024);ctx.drawImage(img,0,0,1024,1024);s.lastDrawn=s.index;}article.querySelector('.counter').textContent=`${s.index+1} / ${g.frames.length}`;article.querySelector('input').value=s.index+1;article.querySelector('.play').textContent=s.playing?'暂停':'播放';article.dataset.frame=String(s.index+1)};s.step=(d)=>{s.playing=false;s.index=(s.index+d+g.frames.length)%g.frames.length;s.elapsed=0;s.draw()};article.querySelector('.play').onclick=()=>{s.playing=!s.playing;s.elapsed=0;s.draw()};article.querySelector('.prev').onclick=()=>s.step(-1);article.querySelector('.next').onclick=()=>s.step(1);article.querySelector('input').oninput=e=>{s.playing=false;s.index=Number(e.target.value)-1;s.elapsed=0;s.draw()};article.querySelector('.focus').onclick=()=>article.classList.toggle('focus');s.draw();states.push(s)}let last=performance.now();function tick(now){const delta=Math.min(now-last,100);last=now;for(const s of states){if(s.playing&&s.g.frames.length){s.elapsed+=delta*speed;while(s.elapsed>=s.g.durationMs){s.elapsed-=s.g.durationMs;s.index=(s.index+1)%s.g.frames.length}s.draw()}}requestAnimationFrame(tick)}requestAnimationFrame(tick);document.querySelector('#allplay').onclick=()=>states.forEach(s=>{s.playing=true;s.elapsed=0;s.draw()});document.querySelector('#allpause').onclick=()=>states.forEach(s=>{s.playing=false;s.draw()});document.querySelector('#speed').onchange=e=>{speed=Number(e.target.value);states.forEach(s=>s.elapsed=0)};document.querySelector('#bg').onchange=e=>document.body.className=e.target.value;</script></html>
