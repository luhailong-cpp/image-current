<!doctype html><html lang="zh-CN" data-group="hit-E"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>符小虎 · 战斗动作检查</title>
<style>body{font-family:system-ui,sans-serif;background:#163d36;color:#f9f1d9;margin:0;padding:22px}h1{font-size:24px;margin:0 0 8px}p{color:#d3decf;margin:0 0 18px}button,select,input{accent-color:#bb9347}button,select{padding:9px 14px;border:1px solid #b89b59;border-radius:6px;background:#f5ecd7;color:#234a3b;cursor:pointer}header{position:sticky;top:0;background:#163d36eF;padding:10px 0;z-index:3}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}article{background:#ece9d8;color:#183b32;border:2px solid #b99a55;border-radius:10px;padding:14px}h2{font-size:18px;margin:0 0 8px}.stage{background:repeating-conic-gradient(#e4e7dc 0% 25%,#d4dcce 0% 50%) 50%/24px 24px}.stage img{width:100%;display:block}label{display:block;margin:8px 0}.scrub{width:100%}small{display:block;margin:5px 0;color:#526b59}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}a{color:#1e604b}</style>
<header><h1>符小虎 · 两向三动作</h1><p>68 张独立动作帧。固定整画布播放，可检查前爪、后足、尾巴、披肩与收势。</p><div class="controls"><button id="allPlay">全部播放</button><button id="allPause">全部暂停</button><label>速度 <select id="speed"><option value="1">正常 1×</option><option value="0.25">慢放 0.25×</option></select></label><label>底色 <select id="bg"><option value="checker">棋盘</option><option value="#172820">深色</option><option value="#ffffff">白色</option></select></label></div></header><main id="groups"></main>
<script src="data.js"></script><script>
const actions={hit:'受击',attack:'普攻',cast:'施法'}, states=[];let speed=1;
const activeGroup=document.documentElement.dataset.group; for(const g of COMBAT_DATA.filter(g=>!activeGroup||g.action+'-'+g.direction===activeGroup)){const el=document.createElement('article');el.innerHTML=`<h2>${actions[g.action]} · ${g.direction} ${g.direction==='E'?'右下斜前':'左上斜后'}</h2><small>${g.frames.length}/${g.expectedFrames} 张，每帧 ${g.durationMs}ms，整段 ${g.expectedFrames*g.durationMs}ms</small><div class="stage"><img alt="${g.action}-${g.direction}当前帧"></div><label>逐帧 <input class="scrub" type="range" min="1" max="${g.frames.length||1}" value="1"></label><div class="controls"><button class="play">播放</button><button class="prev">上一帧</button><button class="next">下一帧</button><output>加载中</output></div><a href="${g.action}-${g.direction}-frames.jpg">逐帧总览</a> · <a href="${g.action}-${g.direction}.html">独立预览</a> · <a href="${g.action}-${g.direction}-normal.webp">正常动画</a> · <a href="${g.action}-${g.direction}-slow.webp">慢放动画</a>`;document.querySelector('main').append(el);
const s={g,el,i:0,playing:false,last:0,loaded:0};states.push(s);const imgs=g.frames.map(f=>{const x=new Image();x.onload=()=>{s.loaded++;render(s)};x.src='../'+f.file;return x});s.imgs=imgs;
function step(d){s.playing=false;s.i=(s.i+d+g.frames.length)%g.frames.length;render(s)}el.querySelector('.prev').onclick=()=>step(-1);el.querySelector('.next').onclick=()=>step(1);el.querySelector('.play').onclick=()=>{s.playing=!s.playing;s.last=performance.now();render(s)};el.querySelector('.scrub').oninput=e=>{s.playing=false;s.i=Number(e.target.value)-1;render(s)};render(s)}
function render(s){if(!s.g.frames.length)return;const f=s.g.frames[s.i];s.el.querySelector('img').src='../'+f.file;s.el.querySelector('output').textContent=`第 ${f.frame} 帧 · 已载 ${s.loaded}/${s.g.frames.length}`;s.el.querySelector('.scrub').value=s.i+1;s.el.querySelector('.play').textContent=s.playing?'暂停':'播放';s.el.dataset.frame=String(f.frame);s.el.dataset.loaded=String(s.loaded)}
function tick(t){for(const s of states){if(s.playing&&s.loaded===s.g.frames.length&&t-s.last>=s.g.durationMs/speed){const n=Math.floor((t-s.last)/(s.g.durationMs/speed));s.i=(s.i+n)%s.g.frames.length;s.last+=n*s.g.durationMs/speed;render(s)}}requestAnimationFrame(tick)}requestAnimationFrame(tick);
document.querySelector('#speed').onchange=e=>{speed=Number(e.target.value);for(const s of states)s.last=performance.now()};document.querySelector('#allPlay').onclick=()=>{for(const s of states){s.playing=true;s.last=performance.now();render(s)}};document.querySelector('#allPause').onclick=()=>{for(const s of states){s.playing=false;render(s)}};document.querySelector('#bg').onchange=e=>{for(const el of document.querySelectorAll('.stage'))el.style.background=e.target.value==='checker'?'':e.target.value};
</script></html>
