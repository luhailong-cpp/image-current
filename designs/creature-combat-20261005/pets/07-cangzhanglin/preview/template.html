<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>苍嶂麟 · 战斗动作</title>
<style>
:root{color-scheme:dark;--ink:#eff4f1;--muted:#a8bab4;--line:#34483f;--accent:#c4e6b0;--panel:#18271f;--stage:#bac9c1}
*{box-sizing:border-box}body{margin:0;background:#101b15;color:var(--ink);font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif}
button,select,input{font:inherit}button,select{background:#26392e;color:var(--ink);border:1px solid #476050;border-radius:8px;padding:8px 13px;cursor:pointer}button:hover,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}button[aria-pressed=true]{background:var(--accent);color:#173120;border-color:var(--accent)}a{color:#c7deb8;text-underline-offset:3px}.wrap{max-width:1500px;margin:auto;padding:22px 24px 30px}.top{display:flex;align-items:start;justify-content:space-between;gap:18px;margin-bottom:16px}h1{font-size:27px;line-height:1.2;letter-spacing:.08em;margin:0 0 8px}.subtitle{margin:0;color:var(--muted);font-size:13px}.status{text-align:right;color:#d9cb9e;font-size:13px}.status strong{display:block;color:var(--ink);font-size:18px}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:9px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:17px}.toolbar .gap{width:10px}.toolbar label{color:var(--muted);display:flex;align-items:center;gap:6px}.hint{font-size:12px;color:var(--muted);margin-left:auto}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden}.card-head{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;gap:10px}.card h2{font-size:17px;font-weight:600;margin:0}.card h2 span{color:var(--muted);font-size:12px;font-weight:400;margin-left:9px}.frame-label{font:13px ui-monospace,Consolas,monospace;color:#d8ddc1;white-space:nowrap}.stage{aspect-ratio:1;position:relative;isolation:isolate;overflow:hidden;cursor:zoom-in;background-color:var(--stage);background-image:linear-gradient(45deg,#879b921f 25%,transparent 25%),linear-gradient(-45deg,#879b921f 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#879b921f 75%),linear-gradient(-45deg,transparent 75%,#879b921f 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}.stage img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain}.stage[data-background=dark]{background:#19212c}.stage[data-background=light]{background:#f1f0e8}.stage[data-background=green]{background:#416653}.anchor{position:absolute;left:50%;top:91.9921875%;width:19px;height:19px;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 1px 1px #000)}.anchor:before,.anchor:after{content:"";position:absolute;background:#f8dc7e}.anchor:before{left:0;right:0;top:9px;height:1px}.anchor:after{top:0;bottom:0;left:9px;width:1px}.anchor i{position:absolute;border:1px solid #f8dc7e;border-radius:50%;width:7px;height:7px;left:6px;top:6px}.missing{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#552c23;font-weight:600;background:#d0ccc1}.missing[hidden]{display:none}.missing small{font-size:12px;font-weight:400}.event{position:absolute;top:10px;left:10px;border:1px solid #edd08499;border-radius:5px;padding:2px 6px;font-size:11px;background:#183323d9;color:#ffe8a8;pointer-events:none}.event:empty{display:none}.card-bottom{padding:9px 12px 11px;display:flex;gap:9px;align-items:center}.card-bottom button{padding:3px 10px;font-size:16px}.card-bottom input{width:100%;accent-color:#b7d898;min-width:10px}.card-bottom a{font-size:12px;white-space:nowrap}.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-top:15px;color:var(--muted);font-size:12px}.review-note{margin:15px 0 0;font-size:12px;color:var(--muted)}dialog{border:1px solid #708571;border-radius:12px;background:#15231b;color:var(--ink);padding:12px;max-width:calc(100vw - 24px)}dialog::backdrop{background:#000b}dialog .stage{width:min(80vh,85vw);max-width:1024px}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.dialog-head h2{margin:0;font-size:17px}.dialog-controls{display:flex;gap:12px;align-items:center;margin-top:10px}.dialog-controls input{flex:1;accent-color:#b7d898}.loading{opacity:.65}@media(min-width:1100px) and (max-height:1050px){.wrap{max-width:1280px;padding-top:15px}.stage{max-height:calc((100vh - 280px)/2);aspect-ratio:auto}.stage img{object-fit:contain}.anchor{left:50%;top:91.9921875%}}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hint{width:100%;margin:0}.top{align-items:center}.wrap{padding:16px}}@media(max-width:560px){.grid{grid-template-columns:1fr}.status{display:none}.toolbar .gap{display:none}.toolbar button{padding:7px 10px}}
/* Keep each preview square: a non-square stage would misplace the anchor. */
@media(min-width:1100px) and (max-height:1050px){.grid{max-width:min(100%,calc(150vh - 540px));margin-inline:auto}.stage{max-height:none;aspect-ratio:1}.card-head{padding:8px 10px}.card h2{font-size:14px}.card h2 span{font-size:11px;margin-left:5px}.card-bottom{padding:7px 10px}.frame-label{font-size:12px}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div><h1>苍嶂麟</h1><p class="subtitle">受击 · 普攻 · 施法　／　E 斜前右下 · W 真斜后左上</p></div><div class="status"><strong id="frameCount">— / 68 帧</strong><span id="availability">正在读取预览</span></div></header>
<div class="toolbar" aria-label="播放控制">
<button id="play" aria-pressed="true">暂停</button><button id="restart">从头播放</button>
<button id="back" title="暂停并将六组各后退一帧">← 前一帧</button><button id="next" title="暂停并将六组各前进一帧">后一帧 →</button>
<span class="gap"></span><button class="speed" data-speed="1" aria-pressed="true">正常 1×</button><button class="speed" data-speed="0.25" aria-pressed="false">慢放 0.25×</button>
<span class="gap"></span><label>背景 <select id="background"><option value="checker">透明网格</option><option value="dark">深色</option><option value="light">浅色</option><option value="green">青绿</option></select></label>
<label><input id="anchors" type="checkbox" checked>锚点</label><span class="hint">空格暂停　← / → 逐帧　点击画面放大</span>
</div>
<div class="grid" id="groups"></div>
<p class="review-note">六组共用播放起点，分别按 40 / 30 / 45 ms 每帧循环。暂停后可独立拖动每组帧号；十字为统一落地锚点。</p>
<footer class="foot"><span id="playState" role="status">正在载入图片…</span><span>游戏接入未验证</span></footer>
</main>
<dialog id="zoom"><div class="dialog-head"><h2 id="zoomTitle"></h2><button id="zoomClose">关闭</button></div><div class="stage" id="zoomStage"><img id="zoomImage" alt=""><div class="missing" hidden id="zoomMissing">该帧尚未提供</div><span class="anchor"><i></i></span></div><div class="dialog-controls"><button id="zoomBack">←</button><input id="zoomSlider" type="range" min="1" value="1" aria-label="放大帧号"><button id="zoomNext">→</button><span id="zoomFrame"></span></div></dialog>
<script id="previewData" type="application/json">__PREVIEW_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('previewData').textContent);
const $=id=>document.getElementById(id), states=[], cards=$('groups');
let playing=true,speed=1,elapsed=0,lastTick=null,background='checker',showAnchors=true,zoomState=null,loaded=0,failed=0;
const pad=n=>String(n).padStart(2,'0');
function asset(path){return '../'+path;}
function setPlay(value){playing=value;lastTick=null;$('play').textContent=value?'暂停':'播放';$('play').setAttribute('aria-pressed',String(value));updateState();}
function updateState(){$('playState').textContent=(playing?'正在播放':'已暂停')+' · '+speed+'× · 已载入 '+loaded+' 帧'+(failed?' · '+failed+' 帧不可用':'');}
function draw(state,index){state.index=(index+state.group.expectedFrames)%state.group.expectedFrames;const frame=state.group.frames[state.index],url=asset(frame.file);if(state.image.getAttribute('src')!==url)state.image.src=url;state.image.hidden=!frame.exists||frame.loadFailed;state.missing.hidden=frame.exists&&!frame.loadFailed;state.label.textContent=pad(state.index+1)+' / '+pad(state.group.expectedFrames);state.slider.value=state.index+1;state.event.textContent=frame.event?(frame.action==='attack'?'顶击':'施法释放'):'';if(zoomState===state)drawZoom();}
function step(state,delta){setPlay(false);draw(state,state.index+delta);}
function drawZoom(){if(!zoomState)return;const state=zoomState,frame=state.group.frames[state.index];$('zoomImage').src=asset(frame.file);$('zoomImage').hidden=!frame.exists||frame.loadFailed;$('zoomMissing').hidden=frame.exists&&!frame.loadFailed;$('zoomFrame').textContent=pad(state.index+1)+' / '+pad(state.group.expectedFrames);$('zoomSlider').value=state.index+1;}
function applyBackground(){document.querySelectorAll('.stage').forEach(el=>el.dataset.background=background);document.querySelectorAll('.anchor').forEach(el=>el.hidden=!showAnchors);}
function openZoom(state){setPlay(false);zoomState=state;$('zoomTitle').textContent=state.group.label+' · '+state.group.direction;$('zoomSlider').max=state.group.expectedFrames;drawZoom();$('zoom').showModal();}
for(const group of data.groups){
 const card=document.createElement('section');card.className='card';card.innerHTML='<div class="card-head"><h2>'+group.label+' · '+group.direction+'<span>'+group.durationMs+' ms × '+group.expectedFrames+'</span></h2><span class="frame-label"></span></div><div class="stage" tabindex="0" role="button" aria-label="放大'+group.label+group.direction+'"><img alt="'+group.label+group.direction+'"><div class="missing" hidden>该帧尚未提供<small>补齐后重新构建预览</small></div><span class="anchor"><i></i></span><span class="event"></span></div><div class="card-bottom"><button class="prev" aria-label="'+group.label+group.direction+'前一帧">‹</button><input type="range" min="1" max="'+group.expectedFrames+'" value="1" aria-label="'+group.label+group.direction+'帧号"><button class="next" aria-label="'+group.label+group.direction+'后一帧">›</button><a href="contact/'+group.action+'-'+group.direction+'.png" target="_blank">全帧图</a></div>';
 cards.append(card);const state={group,index:0,card,image:card.querySelector('img'),missing:card.querySelector('.missing'),label:card.querySelector('.frame-label'),slider:card.querySelector('input'),event:card.querySelector('.event')};states.push(state);draw(state,0);
 card.querySelector('.prev').addEventListener('click',()=>step(state,-1));card.querySelector('.next').addEventListener('click',()=>step(state,1));state.slider.addEventListener('input',()=>{setPlay(false);draw(state,Number(state.slider.value)-1);});card.querySelector('.stage').addEventListener('click',()=>openZoom(state));card.querySelector('.stage').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();openZoom(state);}});
}
$('frameCount').textContent=data.presentFrames+' / '+data.expectedFrames+' 帧';$('availability').textContent=data.presentFrames===data.expectedFrames?'六组已齐全':'仍有 '+(data.expectedFrames-data.presentFrames)+' 帧待补齐';
$('play').addEventListener('click',()=>{if(!playing){for(const state of states)state.phase=state.index*state.group.durationMs-elapsed;}setPlay(!playing);});
$('restart').addEventListener('click',()=>{elapsed=0;for(const state of states){state.phase=0;draw(state,0);}setPlay(true);});
$('back').addEventListener('click',()=>{setPlay(false);states.forEach(state=>draw(state,state.index-1));});$('next').addEventListener('click',()=>{setPlay(false);states.forEach(state=>draw(state,state.index+1));});
document.querySelectorAll('.speed').forEach(button=>button.addEventListener('click',()=>{speed=Number(button.dataset.speed);lastTick=null;document.querySelectorAll('.speed').forEach(el=>el.setAttribute('aria-pressed',String(el===button)));updateState();}));
$('background').addEventListener('change',event=>{background=event.target.value;applyBackground();});$('anchors').addEventListener('change',event=>{showAnchors=event.target.checked;applyBackground();});
$('zoomClose').addEventListener('click',()=>$('zoom').close());$('zoom').addEventListener('close',()=>{zoomState=null;});$('zoomBack').addEventListener('click',()=>step(zoomState,-1));$('zoomNext').addEventListener('click',()=>step(zoomState,1));$('zoomSlider').addEventListener('input',()=>draw(zoomState,Number($('zoomSlider').value)-1));
document.addEventListener('keydown',event=>{if(event.target.matches('input,select,button'))return;if(event.code==='Space'){event.preventDefault();$('play').click();}if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();if(zoomState)step(zoomState,event.key==='ArrowLeft'?-1:1);else $(event.key==='ArrowLeft'?'back':'next').click();}});
document.addEventListener('visibilitychange',()=>{lastTick=null;});
function tick(now){if(playing&&lastTick!==null){elapsed+=(now-lastTick)*speed;for(const state of states){const duration=state.group.durationMs*state.group.expectedFrames;const position=((elapsed+(state.phase||0))%duration+duration)%duration;const index=Math.floor(position/state.group.durationMs);if(index!==state.index)draw(state,index);}}lastTick=now;requestAnimationFrame(tick);}
applyBackground();
Promise.all(states.flatMap(state=>state.group.frames.map(frame=>new Promise(resolve=>{if(!frame.exists){failed++;resolve();return;}const image=new Image();image.onload=()=>{loaded++;resolve();};image.onerror=()=>{failed++;frame.loadFailed=true;resolve();};image.src=asset(frame.file);}))))
.then(()=>{states.forEach(state=>draw(state,state.index));updateState();requestAnimationFrame(tick);});
</script>
</body>
</html>
