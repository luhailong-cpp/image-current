56": null, "sha256": "299886bd419cc3cc576f55ed6577b69001d18e01464372091fb38fac453fbf1e"}, {"file": "D:/work/image/designs/pets-xianling-20260924/source/07-cangzhanglin-W.png", "role": "original W anatomical identity", "exists": true, "permittedScope": true, "recordedSha256": null, "sha256": "b4c3333ac8790d06de71ed52b403cadbe2e7bade8419150e464e80d656fed663"}, {"file": "D:/work/image/designs/attribute-panels/v2-painted/01-character-ui-no-affinity.png", "role": "primary approved style", "exists": true, "permittedScope": true, "recordedSha256": null, "sha256": "e64a817c55b59cf5cc47533428f2e560c64a83f3577067a6fb5969244baf3d6b"}, {"file": "staging/cast/E/01.png", "role": "initial E cast composition scale/hoof-footprint reference", "exists": false, "permittedScope": true, "recordedSha256": "f80e84dc2fc6ddde7ff0d163688aea9cc550d1c641df5cf426b910554505c9ae", "historicalSourceDigest": "f80e84dc2fc6ddde7ff0d163688aea9cc550d1c641df5cf426b910554505c9ae", "retiredHistoricalSource": true}]}], "contactSheet": "preview/contact/cast-E.png"}]}</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('previewData').textContent);
const $=id=>document.getElementById(id), states=[], cards=$('groups');
let playing=true,speed=1,elapsed=0,lastTick=null,background='checker',showAnchors=true,zoomState=null,loaded=0,failed=0;
const pad=n=>String(n).padStart(2,'0');
function asset(path){return '../'+path;}
function setPlay(value){playing=value;lastTick=null;$('play').textContent=value?'暂停':'播放';$('play').setAttribute('aria-pressed',String(value));updateState();}
function updateState(){$('playState').textContent=(playing?'正在播放':'已暂停')+' · '+speed+'× · 已载入 '+loaded+' 帧'+(failed?' · '+failed+' 帧不可用':'');}
function draw(state,index){state.index=(index+state.group.expectedFrames)%state.group.expectedFrames;const frame=state.group.frames[state.index],url=asset(frame.file);if(state.image.getAttribute('src')!==url)state.image.src=url;state.image.hidden=!frame.exists||frame.loadFailed;state.missing.hidden=frame.exists&&!frame.loadFailed;state.label.textContent=pad(state.index+1)+' / '+pad(state.group.expectedFrames);state.slider.value=state.index+1;state.event.textContent=frame.event?(frame.action==='attack'?'顶击':'施法释放'):'';if(zoomState===state)drawZoom();}
function step(state,delta){setPlay(false);draw(state,state.index+delta);}
function drawZoom(){if(!zoomState)return;const state=zoomState,frame=state.group.frames[state.index];$('zoomImage').src=asset(frame.file);$('zoomImage').hidden=!frame.exists||frame.loadFailed;$('zoomMissing').hidden=frame.exists&&!frame.loadFailed;$('zoomFrame').textContent=pad(state.index+1)+' / '+pad(state.group.expectedFrames);$('zoomSlider').value=state.index+1;}
function applyBackground(){document.querySelectorAll('.stage').forEach(el=>el.dataset.background=background);document.querySelectorAll('.anchor').forEach(el=>el.hidden=!showAnchors);}
function openZoom(state){setPlay(false);zoomState=state;$('zoomTitle').textContent=state.group.label+' · '+state.group.direction;$('zoomSlider').max=state.group.expectedFrames;drawZoom();$('zoom').showModal();}
for(const group of data.groups){
 const card=document.createElement('section');card.className='card';card.innerHTML='<div class="card-head"><h2>'+group.label+' · '+group.direction+'<span>'+group.durationMs+' ms × '+group.expectedFrames+'</span></h2><span class="frame-label"></span></div><div class="stage" tabindex="0" role="button" aria-label="放大'+group.label+group.direction+'"><img alt="'+group.label+group.direction+'"><div class="missing" hidden>该帧尚未提供<small>补齐后重新构建预览</small></div><span class="anchor"><i></i></span><span class="event"></span></div><div class="card-bottom"><button class="prev" aria-label="'+group.label+group.direction+'前一帧">‹</button><input type="range" min="1" max="'+group.expectedFrames+'" value="1" aria-label="'+group.label+group.direction+'帧号"><button class="next" aria-label="'+group.label+group.direction+'后一帧">›</button><a href="contact/'+group.action+'-'+group.direction+'.png" target="_blank">全帧图</a></div>';
 cards.append(card);const state={group,index:0,card,image:card.querySelector('img'),missing:card.querySelector('.missing'),label:card.querySelector('.frame-label'),slider:card.querySelector('input'),event:card.querySelector('.event')};states.push(state);draw(state,0);
 card.querySelector('.prev').addEventListener('click',()=>step(state,-1));card.querySelector('.next').addEventListener('click',()=>step(state,1));state.slider.addEventListener('input',()=>{setPlay(false);draw(state,Number(state.slider.value)-1);});card.querySelector('.stage').addEventListener('click',()=>openZoom(state));card.querySelector('.stage').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();openZoom(state);}});
}
$('frameCount').textContent=data.presentFrames+' / '+data.expectedFrames+' 帧';$('availability').textContent=data.presentFrames===data.expectedFrames?'本组已齐全':'仍有 '+(data.expectedFrames-data.presentFrames)+' 帧待补齐';
$('play').addEventListener('click',()=>{if(!playing){for(const state of states)state.phase=state.index*state.group.durationMs-elapsed;}setPlay(!playing);});
$('restart').addEventListener('click',()=>{elapsed=0;for(const state of states){state.phase=0;draw(state,0);}setPlay(true);});
$('back').addEventListener('click',()=>{setPlay(false);states.forEach(state=>draw(state,state.index-1));});$('next').addEventListener('click',()=>{setPlay(false);states.forEach(state=>draw(state,state.index+1));});
document.querySelectorAll('.speed').forEach(button=>button.addEventListener('click',()=>{speed=Number(button.dataset.speed);lastTick=null;document.querySelectorAll('.speed').forEach(el=>el.setAttribute('aria-pressed',String(el===button)));updateState();}));
$('background').addEventListener('change',event=>{background=event.target.value;applyBackground();});$('anchors').addEventListener('change',event=>{showAnchors=event.target.checked;applyBackground();});
$('zoomClose').addEventListener('click',()=>$('zoom').close());$('zoom').addEventListener('close',()=>{zoomState=null;});$('zoomBack').addEventListener('click',()=>step(zoomState,-1));$('zoomNext').addEventListener('click',()=>step(zoomState,1));$('zoomSlider').addEventListener('input',()=>draw(zoomState,Number($('zoomSlider').value)-1));
document.addEventListener('keydown',event=>{if(event.target.matches('input,select,button'))return;if(event.code==='Space'){event.preventDefault();$('play').click();}if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();if(zoomState)step(zoomState,event.key==='ArrowLeft'?-1:1);else $(event.key==='ArrowLeft'?'back':'next').click();}});
document.addEventListener('visibilitychange',()=>{lastTick=null;});
function tick(now){if(playing&&lastTick!==null){elapsed+=(now-lastTick)*speed;for(const state of states){const duration=state.group.durationMs*state.group.expectedFrames;const position=((elapsed+(state.phase||0))%duration+duration)%duration;const index=Math.floor(position/state.group.durationMs);if(index!==state.index)draw(state,index);}}lastTick=now;requestAnimationFrame(tick);}
applyBackground();
Promise.all(states.flatMap(state=>state.group.frames.map(frame=>new Promise(resolve=>{if(!frame.exists){failed++;resolve();return;}const image=new Image();image.onload=()=>{loaded++;resolve();};image.onerror=()=>{failed++;frame.loadFailed=true;resolve();};image.src=asset(frame.file);}))))
.then(()=>{states.forEach(state=>draw(state,state.index));updateState();requestAnimationFrame(tick);});
</script>
