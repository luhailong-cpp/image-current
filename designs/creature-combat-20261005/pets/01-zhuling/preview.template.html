<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>烛翎 · 三式战斗</title>
<style>
:root{font-family:"Microsoft YaHei",sans-serif;color:#eee6cc;background:#142d2b;color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:24px;max-width:1550px;margin:auto}h1{font-size:25px;letter-spacing:3px;margin:0 0 8px}p{font-size:14px;color:#c0cbbb;margin:6px 0 18px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}nav{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0 20px}button,select{font:inherit;border:1px solid #92825a;color:#eee6cc;background:#244f48;border-radius:8px;padding:8px 13px;cursor:pointer}button:hover{background:#356457}button.active{background:#957748;color:#fff}main{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{border:1px solid #786c4b;border-radius:14px;overflow:hidden;background:#203a35;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;padding:12px 15px}.name{font-size:17px}.meta{font-size:12px;color:#b9c6b3}.stage{aspect-ratio:1;position:relative;background-color:#394341;background-image:linear-gradient(45deg,#444f4d 25%,transparent 25%),linear-gradient(-45deg,#444f4d 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#444f4d 75%),linear-gradient(-45deg,transparent 75%,#444f4d 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}.stage.dark{background:#142022}.stage.light{background:#eee6d5}canvas{width:100%;height:100%;display:block}.bottom{padding:12px 15px}.readout{font-size:13px;margin-bottom:9px;min-height:18px}input[type=range]{width:100%;accent-color:#cfb56f}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px}.row button{font-size:12px;padding:5px 8px}.foot{margin-top:20px;font-size:12px;color:#aabbb1}.card.focus{grid-column:1/-1;max-width:850px;width:100%;margin:auto}.hide{display:none}.badge{font-size:12px;color:#d9c184}@media(max-width:900px){main{grid-template-columns:repeat(2,1fr)}header{display:block}}@media(max-width:560px){main{grid-template-columns:1fr}body{padding:14px}}
</style>
<header><div><h1>烛翎 · 三式战斗</h1><p>靛蓝灵鸦 · E 斜前朝右下 / W 斜后朝左上</p></div><span id="status" class="badge"></span></header>
<nav><button id="play">暂停</button><button id="normal" class="active">正常 1×</button><button id="slow">慢放 0.25×</button><button id="reset">从首帧播放</button><select id="background" aria-label="背景"><option value="check">透明棋盘</option><option value="dark">深色底</option><option value="light">浅色底</option></select><button id="all">显示六组</button></nav>
<main id="grid"></main><p class="foot">每个画面只切换真实 PNG 帧，无镜像、位移复制或插帧。受击 40ms / 普攻 30ms / 施法 45ms。拖动滑块或点前后帧自动暂停。未接入或验证客户端。</p>
<script>
const manifest=__MANIFEST__;const names={hit:'受击',attack:'普攻',cast:'施法'};let running=true,speed=1,elapsed=0,previous=performance.now();
document.querySelector('#status').textContent=`已落盘 ${manifest.presentFrameCount} / 68 帧`;
const cards=manifest.groups.map(g=>{const el=document.createElement('section');el.className='card';el.dataset.group=g.action+'-'+g.direction;
el.innerHTML=`<div class="top"><span class="name">${names[g.action]} · ${g.direction}</span><span class="meta">${g.expectedFrames}帧 / ${g.totalDurationMs}ms</span></div><div class="stage"><canvas width="1024" height="1024" aria-label="${names[g.action]} ${g.direction}动画"></canvas></div><div class="bottom"><div class="readout"></div><input type="range" min="1" max="${g.expectedFrames}" value="1" aria-label="${names[g.action]} ${g.direction}逐帧"><div class="row"><button class="prev">前一帧</button><button class="next">后一帧</button><button class="zoom">放大此组</button></div></div>`;document.querySelector('#grid').append(el);
const ctx=el.querySelector('canvas').getContext('2d'),images=new Map();g.frames.forEach(f=>{const i=new Image();i.src='../'+f.file;images.set(f.frame,i)});
const item={g,el,ctx,images,index:1};
function select(n){pause();item.index=Math.max(1,Math.min(g.expectedFrames,n));draw(item)}
el.querySelector('input').addEventListener('input',e=>select(+e.target.value));el.querySelector('.prev').onclick=()=>select(item.index-1);el.querySelector('.next').onclick=()=>select(item.index+1);el.querySelector('.zoom').onclick=()=>cards.forEach(c=>{c.el.classList.toggle('hide',c!==item);c.el.classList.toggle('focus',c===item)});return item});
function draw(c){c.ctx.clearRect(0,0,1024,1024);const i=c.images.get(c.index),f=c.g.frames.find(f=>f.frame===c.index);if(i&&i.complete&&i.naturalWidth)c.ctx.drawImage(i,0,0);else{c.ctx.fillStyle='#d8cba5';c.ctx.font='36px sans-serif';c.ctx.fillText('此帧尚未生成',360,512)}c.el.querySelector('input').value=c.index;c.el.querySelector('.readout').textContent=`第 ${String(c.index).padStart(2,'0')} / ${c.g.expectedFrames} 帧 · ${f?f.phase:'待制作'}${f&&f.event?' · '+f.event:''}`;}
function pause(){running=false;document.querySelector('#play').textContent='播放'}
document.querySelector('#play').onclick=()=>{running=!running;document.querySelector('#play').textContent=running?'暂停':'播放'};
function setSpeed(v){speed=v;document.querySelector('#normal').classList.toggle('active',v===1);document.querySelector('#slow').classList.toggle('active',v===.25)}
document.querySelector('#normal').onclick=()=>setSpeed(1);document.querySelector('#slow').onclick=()=>setSpeed(.25);document.querySelector('#reset').onclick=()=>{elapsed=0;running=true;document.querySelector('#play').textContent='暂停'};
document.querySelector('#background').onchange=e=>document.querySelectorAll('.stage').forEach(s=>s.className='stage '+e.target.value);document.querySelector('#all').onclick=()=>cards.forEach(c=>c.el.classList.remove('hide','focus'));
function tick(now){const dt=now-previous;previous=now;if(running)elapsed+=dt*speed;cards.forEach(c=>{if(running)c.index=Math.floor(elapsed/c.g.durationMs)%c.g.expectedFrames+1;draw(c)});requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
