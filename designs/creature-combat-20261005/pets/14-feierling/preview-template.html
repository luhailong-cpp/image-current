<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>绯耳灵 · 战斗动作检查</title>
<style>body{margin:0;background:#172923;color:#e9e5da;font:16px system-ui}header{padding:20px 28px;position:sticky;top:0;background:#172923ee;z-index:2}h1{font-size:24px;margin:0 0 8px}p{margin:8px 0;color:#bdcec4}button,select,input{font:inherit}button,select{background:#efe6ce;color:#203f33;border:0;border-radius:7px;padding:8px 12px;margin:4px}main{display:grid;grid-template-columns:repeat(3,minmax(280px,1fr));gap:18px;padding:8px 28px 28px}article{background:#243c32;padding:12px;border-radius:12px}h2{font-size:19px;margin:0 0 8px}canvas{width:100%;display:block;background-color:#dddcd2;background-image:linear-gradient(45deg,#b8c2b9 25%,transparent 25%),linear-gradient(-45deg,#b8c2b9 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#b8c2b9 75%),linear-gradient(-45deg,transparent 75%,#b8c2b9 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0;border-radius:8px}input[type=range]{width:100%}.readout{font-variant-numeric:tabular-nums;font-size:14px}.missing{color:#e9b198}@media(max-width:1050px){main{grid-template-columns:repeat(2,minmax(280px,1fr))}}@media(max-width:650px){main{grid-template-columns:1fr}}</style>
<header><h1>绯耳灵 · 受击 / 普攻 / 施法</h1><p>原时间播放、0.25×慢放与独立逐帧。E斜前朝右下 · W斜后朝左上。角色资源预览，客户端尚未接入验收。</p><button id="play">暂停全部</button><select id="speed" aria-label="播放速度"><option value="1">正常 1×</option><option value="0.25">慢放 0.25×</option></select><button id="anchor">显示锚点</button><span id="total"></span><span id="loading" role="status" style="margin-left:12px">正在载入图片…</span></header><main id="groups"></main>
<script>const groups=__GROUPS__;let playing=true,speed=1,showAnchor=false,clockStart=performance.now();const labels={hit:'受击',attack:'普攻',cast:'施法'};let loaded=0;window.previewState={ready:false,mode:'playing',speed:1,rendered:0};const all=[];document.querySelector('#total').textContent=groups.reduce((a,g)=>a+g.frames.length,0)+' / 68 帧';for(const g of groups){const a=document.createElement('article');a.innerHTML=`<h2>${labels[g.action]} · ${g.direction} <small>${g.frames.length}/${g.expectedFrames}</small></h2><canvas width="1024" height="1024"></canvas><div class="readout"></div><input type="range" min="1" max="${Math.max(1,g.frames.length)}" value="1" aria-label="${g.action}-${g.direction}逐帧"><button data-step="-1">上一帧</button><button data-step="1">下一帧</button>`;document.querySelector('#groups').append(a);const s={...g,el:a,ctx:a.querySelector('canvas').getContext('2d'),index:0,images:[]};for(const f of g.frames){const im=new Image;im.src=f.file;im.onload=()=>{loaded++;window.previewState.ready=loaded===groups.reduce((n,x)=>n+x.frames.length,0);document.querySelector('#loading').textContent=window.previewState.ready?'全部图片已载入':`载入 ${loaded}/68`;if(window.previewState.ready)clockStart=performance.now()};im.onerror=()=>{document.querySelector('#loading').textContent='图片载入失败：'+f.file};s.images.push(im)}const range=a.querySelector('input');range.oninput=()=>{playing=false;document.querySelector('#play').textContent='播放全部';s.index=Number(range.value)-1;window.previewState.mode='frame'};a.querySelectorAll('button').forEach(b=>b.onclick=()=>{playing=false;document.querySelector('#play').textContent='播放全部';s.index=(s.index+Number(b.dataset.step)+s.frames.length)%s.frames.length;range.value=s.index+1;window.previewState.mode='frame'});all.push(s)}document.querySelector('#play').onclick=()=>{playing=!playing;clockStart=performance.now();document.querySelector('#play').textContent=playing?'暂停全部':'播放全部';window.previewState.mode=playing?'playing':'paused'};document.querySelector('#speed').onchange=e=>{speed=Number(e.target.value);clockStart=performance.now();window.previewState.speed=speed};document.querySelector('#anchor').onclick=()=>showAnchor=!showAnchor;function tick(t){for(const s of all){if(!s.frames.length)continue;if(playing&&window.previewState.ready)s.index=Math.floor((t-clockStart)*speed/s.durationMs)%s.frames.length;const im=s.images[s.index];s.ctx.clearRect(0,0,1024,1024);if(im?.complete&&im.naturalWidth)s.ctx.drawImage(im,0,0);if(showAnchor){s.ctx.strokeStyle='#dd2f59';s.ctx.lineWidth=3;s.ctx.beginPath();s.ctx.moveTo(482,942);s.ctx.lineTo(542,942);s.ctx.moveTo(512,912);s.ctx.lineTo(512,972);s.ctx.stroke()}s.el.querySelector('.readout').textContent=`${String(s.index+1).padStart(2,'0')} / ${s.frames.length} · ${s.durationMs}ms/帧 · ${(s.durationMs*s.frames.length)}ms/组`;s.el.querySelector('input').value=s.index+1}window.previewState.rendered++;requestAnimationFrame(tick)}requestAnimationFrame(tick);</script></html>
