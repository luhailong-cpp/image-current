<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灵玥 W 施法 · 16帧复查</title><style>body{margin:20px;font-family:system-ui;background:#f3eddf;color:#183c34}h1{font-size:24px}button,select{font:inherit;padding:8px;margin:4px;border:1px solid #baa77a;border-radius:8px;background:#fff8e6;color:#214638}.stage{width:min(76vh,760px);height:min(76vh,760px);background-color:#ddd;background-image:linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.stage img{display:none;width:100%;height:100%;object-fit:contain}.stage img.active{display:block}.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:1400px}.strip figure{margin:0;background:#d6ded7}.strip img{width:100%;display:block}.strip figcaption{padding:6px}#info{font-variant-numeric:tabular-nums;margin:12px 0}a{color:#275443}</style><h1>灵玥 W 施法 · 16 帧</h1><p>只读取实际 PNG。45 ms/帧，720 ms/组。动态与美术仍需人工判断，未接入客户端。</p><button id="play">播放</button><button id="pause">暂停</button><button id="prev">上一帧</button><button id="next">下一帧</button><button id="reset">回首帧</button><label>速度 <select id="speed"><option value="1">1× 原时长</option><option value=".25">0.25× 慢放</option></select></label><input id="range" type="range" min="0" max="15" value="0" aria-label="逐帧"><div id="info"></div><div class="stage" id="stage"></div><h2>逐帧对照</h2><div class="strip" id="strip"></div><script>const images=[],stage=document.querySelector('#stage'),info=document.querySelector('#info'),strip=document.querySelector('#strip');let index=0,playing=false,speed=1,elapsed=0,last;for(let i=1;i<=16;i++){const path=String(i).padStart(2,'0')+'.png',im=new Image();im.src=path;im.alt='灵玥W施法第'+i+'帧';stage.append(im);images.push(im);const fig=document.createElement('figure'),img=new Image(),cap=document.createElement('figcaption');img.src=path;img.alt=im.alt;cap.textContent=String(i).padStart(2,'0');fig.append(img,cap);strip.append(fig);}function render(){images.forEach((im,i)=>im.classList.toggle('active',i===index));document.querySelector('#range').value=index;info.textContent=String(index+1).padStart(2,'0')+' / 16 · 45 ms/帧 · '+speed+'× · '+(playing?'播放中':'已暂停');}document.querySelector('#play').onclick=()=>{playing=true;render()};document.querySelector('#pause').onclick=()=>{playing=false;render()};document.querySelector('#reset').onclick=()=>{playing=false;index=0;elapsed=0;render()};document.querySelector('#prev').onclick=()=>{playing=false;index=(index+15)%16;elapsed=0;render()};document.querySelector('#next').onclick=()=>{playing=false;index=(index+1)%16;elapsed=0;render()};document.querySelector('#speed').onchange=e=>{speed=+e.target.value;elapsed=0;render()};document.querySelector('#range').oninput=e=>{playing=false;index=+e.target.value;elapsed=0;render()};function loop(t){if(last!==undefined&&playing){elapsed+=(t-last)*speed;const steps=Math.floor(elapsed/45);if(steps){elapsed-=steps*45;index=(index+steps)%16;render()}}last=t;requestAnimationFrame(loop)}document.addEventListener('visibilitychange',()=>last=undefined);render();requestAnimationFrame(loop);</script></html>
