<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五行奇谈 · 属性面板 UI 效果图</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#35483f;color:#fff4d5;font:14px "Microsoft YaHei",sans-serif}header{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 18px;border-bottom:1px solid #8d825a;background:#183e33}header span{color:#d0c3a1;margin-right:18px}button,a{border:1px solid #ae955a;border-radius:5px;background:transparent;color:#f8ecd0;padding:9px 20px;font:inherit;text-decoration:none;cursor:pointer}button[aria-pressed="true"]{background:#f4ead0;color:#274f3e}button:focus-visible,a:focus-visible{outline:3px solid #eed589;outline-offset:3px}main{display:grid;place-items:center;min-height:calc(100vh - 66px);padding:12px}img{display:block;max-width:100%;max-height:calc(100vh - 91px);object-fit:contain;box-shadow:0 8px 25px #0b251b33}[hidden]{display:none!important}@media(max-width:600px){header{gap:7px;flex-wrap:wrap}header span{width:100%;text-align:center;margin:0}button,a{padding:8px 12px}main{padding:5px}img{max-height:none}}</style></head>
<body><header><span>五行奇谈 · UI 效果图</span><button type="button" data-view="character" aria-pressed="true">人物面板</button><button type="button" data-view="pet" aria-pressed="false">宝宝面板</button><a id="download" href="01-character-ui-no-affinity.png" download>保存原图</a></header>
<main><img id="character" src="01-character-ui-no-affinity.png" alt="人物属性UI：米白面板、玉绿标题、金色边框、六项战斗属性及四行加点滑杆"><img id="pet" src="02-pet-ui.png" alt="宝宝属性UI：四只宠物列表、六项战斗属性及两列加点控件" hidden></main>
<script>const entries={character:'01-character-ui-no-affinity.png',pet:'02-pet-ui.png'};function show(view){if(!entries[view])view='character';for(const id of Object.keys(entries))document.getElementById(id).hidden=id!==view;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));document.getElementById('download').href=entries[view];history.replaceState({},'',`?view=${view}`);}document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.view)));show(new URLSearchParams(location.search).get('view'));</script></body>
</html>
