<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>02 火符少年 · 960ms跑步复核</title>
<style>body{margin:0;background:#f5efdf;color:#23443c;font:16px system-ui,"Microsoft YaHei"}main{max-width:1000px;margin:auto;padding:24px}h1{font-size:24px}button,select,input{font:inherit}button,select{padding:9px 14px;margin:4px;border-radius:7px;border:1px solid #bcae88;background:#fffbef;color:#24463d;cursor:pointer}.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}.panel{border:1px solid #cdbf9d;border-radius:12px;padding:16px;background:#fffbef}h2{font-size:18px}.stage{position:relative;width:160px;height:160px;margin:24px auto;background:repeating-conic-gradient(#e4e5de 0 25%,#fafaf4 0 50%) 0/16px 16px}.stage img{width:100%;height:100%}.ground{position:absolute;left:0;right:0;border-top:1px dashed #a75d4b;top:89.84375%;display:none}.large .stage{width:384px;height:384px}.status{padding:12px;background:#e9e4d3;border-radius:8px}a{color:#16618c}.inspect{width:400px}p{line-height:1.7}@media(max-width:850px){.large .panels{grid-template-columns:1fr}.large .stage{width:320px;height:320px}}</style>
<main><h1>02 火符少年 · 跑步手脚与接地</h1><p>正常 1×：<b>960ms / 圈，16帧 × 60ms</b>。按用户要求采用均匀时长，已移除旧快档。默认160px整画布显示，可放大检查手脚。2026-10-05 全部196张手脚已重新看图复核，支撑脚轴修正已更新；客户端未接入。</p>
<div class="bar"><label>方向 <select id="direction"><option>N</option><option>NE</option><option selected>E</option><option>SE</option><option>S</option><option>SW</option><option>W</option><option>NW</option></select></label><button id="play">暂停</button><button id="reset">从头播放</button><label><input id="large" type="checkbox">放大检查</label><label><input id="ground" type="checkbox">显示未校准 y920 参考线</label></div>
<div id="panels" class="panels"><section class="panel"><h2>正常 1× · 960ms / 圈</h2><div class="stage"><img alt="960毫秒正常跑步"><div class="ground"></div></div><div class="label"></div></section><section class="panel"><h2>慢放 0.25× · 3840ms / 圈</h2><div class="stage"><img alt="3840毫秒慢放跑步"><div class="ground"></div></div><div class="label"></div></section></div>
<p id="status" class="status">载入真实图片……</p><div class="bar"><button id="previous">上一帧</button><input id="frame" class="inspect" type="range" min="1" max="16" value="1" aria-label="同步逐帧"><button id="next">下一帧</button><output id="frameLabel">01/16</output></div>
<p>同一组16张独立帧循环，无额外首尾停顿。时长已落实；脚向、承重和循环质量按实际图片分别复核。未按最低脚像素贴地，也不做逐帧包围盒缩放。</p><p><a href="index.html">四动作与逐图来源</a> · <a href="../animation-timing.json">当前时长</a> · <a href="../MERGE_HANDOFF.md">合并交接</a></p></main>
<script>
"use strict";const $=x=>document.getElementById(x),cycles=[960,3840],panels=[...document.querySelectorAll(".panel")];let imgs=[],playing=false,ready=false,raf=0,origin=0,elapsed=0,index=0,loadid=0;
function paint(indices){panels.forEach((p,i)=>{const n=indices[i];p.querySelector("img").src=imgs[n].src;p.querySelector(".label").textContent="第 "+String(n+1).padStart(2,"0")+" /16 帧 · "+cycles[i]/16+" ms/帧"});index=indices[0];$("frame").value=index+1;$("frameLabel").textContent=String(index+1).padStart(2,"0")+"/16"}
function tick(){if(!playing||!ready)return;elapsed=Math.max(0,performance.now()-origin);paint(cycles.map(c=>Math.min(15,Math.floor((elapsed%c)*16/c))));raf=requestAnimationFrame(tick)}
function pause(){if(playing)elapsed=performance.now()-origin;playing=false;cancelAnimationFrame(raf);$("play").textContent="播放"}
function start(){if(!ready||playing)return;playing=true;origin=performance.now()-elapsed;$("play").textContent="暂停";raf=requestAnimationFrame(tick)}
async function load(){const id=++loadid;pause();ready=false;$("status").textContent="正在载入 "+$("direction").value+" 方向16张真实图片……";const dir=$("direction").value,version=Date.now();const result=await Promise.all(Array.from({length:16},async(_,i)=>{const im=new Image();im.src="../frames/run/"+dir+"/"+String(i+1).padStart(2,"0")+".png?v="+version;try{await im.decode();return im.naturalWidth===1024&&im.naturalHeight===1024?im:null}catch{return null}}));if(id!==loadid)return;const missing=result.flatMap((im,i)=>im?[]:[i+1]);if(missing.length){$("status").textContent="缺帧："+missing.join("、")+"，停止播放。";return}imgs=result;ready=true;elapsed=0;paint([0,0]);$("status").textContent=dir+" · 16/16已载入 · 正常60ms/帧 · 完整960ms循环 · 每两帧一个接地位置段 · 全动作手脚离线复核完成 · 客户端未接入";start()}
function inspect(n){if(!ready)return;pause();index=(n+16)%16;elapsed=index*60;paint([index,index])}
$("direction").onchange=load;$("play").onclick=()=>playing?pause():start();$("reset").onclick=()=>{pause();elapsed=0;start()};$("previous").onclick=()=>inspect(index-1);$("next").onclick=()=>inspect(index+1);$("frame").oninput=()=>inspect(+$("frame").value-1);$("large").onchange=()=>document.body.classList.toggle("large",$("large").checked);$("ground").onchange=()=>document.querySelectorAll(".ground").forEach(g=>g.style.display=$("ground").checked?"block":"none");document.addEventListener("visibilitychange",()=>{if(document.hidden)pause()});load();
</script></html>
