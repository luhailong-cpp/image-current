<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>06 雷法少年 · 跑步接地和节奏复核</title>
<style>body{font:15px system-ui,'Microsoft YaHei',sans-serif;background:#f4efdf;color:#284c42;margin:24px auto;padding:0 20px;max-width:1050px}h1{font-size:24px}p{line-height:1.7}.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0}button,select,input{font:inherit}button,select{padding:8px;border:1px solid #b6b194;border-radius:6px;background:#fffbed;color:inherit}.panels{display:flex;gap:24px;flex-wrap:wrap}.panel{background:#fff9eb;padding:16px;border-radius:12px;min-width:256px}.stage{position:relative;width:240px;height:240px;margin:auto;background:repeating-conic-gradient(#e3e5dd 0 25%,#f6f6ee 0 50%) 0/24px 24px}.stage img{width:100%;height:100%;object-fit:contain}.ground{position:absolute;left:0;right:0;top:92%;border-top:1px dashed #b3574c;font-size:10px;text-align:right;pointer-events:none}.large .stage{width:384px;height:384px}.meta{margin-top:10px;font-variant-numeric:tabular-nums}#status{min-height:24px}.warning{color:#8b4b37}a{color:#1d6754}</style>
<h1>06 雷法少年 · 跑步接地和节奏复核</h1><p>正常1×跑步为960毫秒/圈，16帧均匀60毫秒；右侧可慢放，手脚与承重仍逐向检查。离线默认240像素，实际游戏内显示与位移尚未接入。</p>
<div class="bar"><label>方向 <select id="direction"></select></label><button id="play">暂停</button><button id="restart">从头</button><label>右侧速度 <select id="cycle"><option value="960" selected>正常 1× · 960ms</option><option value="3840">慢放 ¼× · 3840ms</option></select></label><label><input id="large" type="checkbox">放大逐帧</label><label><input id="ground" type="checkbox">诊断参考线（未标定）</label></div>
<div id="panels" class="panels"><section class="panel"><strong>正常 1× · 960ms / 圈</strong><div class="stage"><img id="old" alt="正常节奏" hidden><div class="ground" hidden>92% 未标定</div></div><div id="oldMeta" class="meta"></div></section><section class="panel"><strong id="trialTitle">正常 1× · 960ms / 圈</strong><div class="stage"><img id="trial" alt="试播节奏" hidden><div class="ground" hidden>92% 未标定</div></div><div id="trialMeta" class="meta"></div></section></div>
<div class="bar"><button id="prev">上一帧</button><input id="frame" type="range" min="0" max="15" value="0"><button id="next">下一帧</button><output id="frameNo">00/15</output></div><p id="status">正在加载…</p><p id="phase">相位记录待加载</p><p class="warning">重点查看：同一支撑脚前端落地→前侧承重→身体经过→后侧蹬离，每个位置两张独立姿态，再换另一脚。参考线不会移动图片；远近脚不能强行压在同一水平线。文件齐全不等于接地通过。</p><p><a href="../index.html">全部动作预览</a> · <a href="review-data.json">来源和试播参数</a></p>
<script>'use strict';
const data=__DATA__, $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
let images=[],playing=false,ready=false,origin=0,elapsed=0,raf=0,lastOld=-1,lastTrial=-1,inspect=0,version=0;
Object.keys(data.sequences).forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d+' · 16帧候选';$('direction').append(o)});
function pause(){if(playing)elapsed=performance.now()-origin;playing=false;cancelAnimationFrame(raf);$('play').textContent='播放'}
function paint(a,b){if(!ready)return;if(a!==lastOld){$('old').src=images[a].src;lastOld=a}if(b!==lastTrial){$('trial').src=images[b].src;lastTrial=b}$('oldMeta').textContent=pad(a)+' / 15 · 60ms';$('trialMeta').textContent=pad(b)+' / 15 · '+Number($('cycle').value)/16+'ms';$('frame').value=b;$('frameNo').textContent=pad(b)+'/15';inspect=b;const phase=data.sequences[$('direction').value].observedPhases?.[b];$('phase').textContent=phase?.matchesCurrentFrame?pad(b)+' · 静态观察：'+phase.phase+'。'+phase.evidence+'；'+phase.note:'当前帧已更新或尚未标注相位，需重新审查。'}
function at(t,c){return Math.floor(((t%c)+c)%c*16/c)%16}
function tick(t){if(!playing||!ready)return;elapsed=t-origin;paint(at(elapsed,960),at(elapsed,Number($('cycle').value)));raf=requestAnimationFrame(tick)}
function start(){if(!ready)return;playing=true;origin=performance.now()-elapsed;$('play').textContent='暂停';raf=requestAnimationFrame(tick)}
function step(n){pause();inspect=(n+16)%16;paint(inspect,inspect);$('status').textContent='逐帧核查 '+pad(inspect)+'：鞋底、支撑侧膝踝、重心、双臂和道具连续性。'}
async function load(){const current=++version;pause();ready=false;lastOld=lastTrial=-1;elapsed=0;$('old').hidden=$('trial').hidden=true;const seq=data.sequences[$('direction').value];try{images=await Promise.all(seq.frames.map(async f=>{const im=new Image();im.src='../../'+f.file+'?sha='+f.sha256.slice(0,12);await im.decode();if(im.naturalWidth!==1024||im.naturalHeight!==1024)throw Error('非1024画布');return im}));if(version!==current)return;ready=true;$('old').hidden=$('trial').hidden=false;$('status').textContent='16张候选已加载；正常960ms，手脚接地仍须复核。';paint(0,0);start()}catch(e){$('status').textContent='加载失败，已停止，不跳过缺帧：'+e.message}}
$('direction').onchange=load;$('play').onclick=()=>playing?pause():start();$('restart').onclick=()=>{pause();elapsed=0;paint(0,0);start()};$('cycle').onchange=()=>{$('trialTitle').textContent=($('cycle').value==='960'?'正常 1×':'慢放 ¼×')+' · '+$('cycle').value+'ms / 圈';pause();elapsed=0;paint(0,0);start()};$('prev').onclick=()=>step(inspect-1);$('next').onclick=()=>step(inspect+1);$('frame').oninput=()=>step(Number($('frame').value));$('large').onchange=()=>$('panels').classList.toggle('large',$('large').checked);$('ground').onchange=()=>document.querySelectorAll('.ground').forEach(e=>e.hidden=!$('ground').checked);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});load();
</script></html>
