function tick(t){if(!playing||!ready)return;elapsed=t-origin;paint(at(elapsed,960),at(elapsed,Number($('cycle').value)));raf=requestAnimationFrame(tick)}
function start(){if(!ready)return;playing=true;origin=performance.now()-elapsed;$('play').textContent='暂停';raf=requestAnimationFrame(tick)}
function step(n){pause();inspect=(n+16)%16;paint(inspect,inspect);$('status').textContent='逐帧核查 '+pad(inspect)+'：鞋底、支撑侧膝踝、重心、双臂和道具连续性。'}
async function load(){const current=++version;pause();ready=false;lastOld=lastTrial=-1;elapsed=0;$('old').hidden=$('trial').hidden=true;const seq=data.sequences[$('direction').value];try{images=await Promise.all(seq.frames.map(async f=>{const im=new Image();im.src='../../'+f.file+'?sha='+f.sha256.slice(0,12);await im.decode();if(im.naturalWidth!==1024||im.naturalHeight!==1024)throw Error('非1024画布');return im}));if(version!==current)return;ready=true;$('old').hidden=$('trial').hidden=false;$('status').textContent='16张候选已加载；正常960ms，手脚接地仍须复核。';paint(0,0);start()}catch(e){$('status').textContent='加载失败，已停止，不跳过缺帧：'+e.message}}
$('direction').onchange=load;$('play').onclick=()=>playing?pause():start();$('restart').onclick=()=>{pause();elapsed=0;paint(0,0);start()};$('cycle').onchange=()=>{$('trialTitle').textContent=($('cycle').value==='960'?'正常 1×':'慢放 ¼×')+' · '+$('cycle').value+'ms / 圈';pause();elapsed=0;paint(0,0);start()};$('prev').onclick=()=>step(inspect-1);$('next').onclick=()=>step(inspect+1);$('frame').oninput=()=>step(Number($('frame').value));$('large').onchange=()=>$('panels').classList.toggle('large',$('large').checked);$('ground').onchange=()=>document.querySelectorAll('.ground').forEach(e=>e.hidden=!$('ground').checked);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});load();
</script></html>
