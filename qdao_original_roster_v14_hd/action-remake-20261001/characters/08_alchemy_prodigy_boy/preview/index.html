<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>08 炼丹童子 · 动作复核</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3efe4;color:#214738;font:16px system-ui,"Microsoft YaHei",sans-serif}main{max-width:1260px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 8px}p{line-height:1.6}.note{color:#845624}select,button{font:inherit;padding:8px 10px;border:1px solid #b1b7a3;border-radius:8px;background:#fffdf7;color:inherit}button{cursor:pointer}nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.stage{display:grid;grid-template-columns:minmax(0,480px) 1fr;gap:20px}.canvasbox{background:#e5e0d3;border-radius:12px;overflow:hidden}#view{display:block;width:100%;height:auto}.details{padding:16px;background:#fffdf7;border-radius:12px}.details b{display:block;margin-bottom:10px}#strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin-top:20px}#strip button{padding:4px}#strip img{width:100%;display:block;background:#e5e0d3}#strip .current{outline:3px solid #1a7e60}#frame{width:100%;margin-top:14px}a{color:#176744}.smallviews{display:flex;align-items:end;gap:12px;flex-wrap:wrap}.smallviews canvas{background:#e5e0d3}small{display:block;margin:6px 0;color:#667266}@media(max-width:740px){.stage{grid-template-columns:1fr}main{padding:14px}}
</style><main><h1>08 炼丹童子 · 动作复核</h1>
<p class="note">跑步正常 1×：960 ms 一圈，完整 16 帧，每帧 60 ms。保留慢放与逐帧检查；这里展示的是离线素材预览。</p>
<nav><select id="group" aria-label="动作方向"></select><button id="play">暂停</button><select id="speed" aria-label="播放速度"><option value="1">正常 1×</option><option value="0.25">慢放 0.25×</option></select><button id="prev">上一帧</button><button id="next">下一帧</button><select id="bg" aria-label="背景"><option value="#e5e0d3">浅底</option><option value="#18322c">深底</option><option value="checker">棋盘</option></select></nav>
<nav><label><input type="checkbox" id="guide">显示 942px 诊断线</label></nav>
<div class="stage"><div class="canvasbox"><canvas id="view" width="1024" height="1024"></canvas></div><aside class="details"><b id="label"></b><div id="info"></div><input id="frame" aria-label="帧序号" type="range" min="0" value="0"><p>完整画布统一缩放，不逐帧贴脚或缩放身体。诊断线不是已校准的接触地面；透视中远近脚可处于不同高度。</p><div class="smallviews"><div><canvas id="small128" width="128" height="128"></canvas><small>128px 显示检查</small></div><div><canvas id="small256" width="256" height="256"></canvas><small>256px 显示检查</small></div></div><p><a id="contact" target="_blank">打开逐帧联系表</a> · <a id="png" target="_blank">当前透明 PNG</a></p></aside></div><div id="strip"></div></main>
<script src="data.js?v=20cc721e73a4"></script><script>
const $=s=>document.querySelector(s),ctx=$('#view').getContext('2d'),data=window.PREVIEW_DATA;
let g,images=[],index=0,playing=true,elapsed=0,last=performance.now();
for(const entry of data){const o=document.createElement('option');o.value=entry.key;o.textContent=entry.key;$('#group').append(o)}
$('#group').value='run/E';
function durations(){return g.frames.map(()=>g.ms)}
function show(){ctx.clearRect(0,0,1024,1024);let bg=$('#bg').value;if(bg==='checker'){for(let y=0;y<1024;y+=32)for(let x=0;x<1024;x+=32){ctx.fillStyle=((x+y)/32)%2?'#d7d7cf':'#f2f0e7';ctx.fillRect(x,y,32,32)}}else{ctx.fillStyle=bg;ctx.fillRect(0,0,1024,1024)}
const im=images[index];if(im?.complete&&im.naturalWidth)ctx.drawImage(im,0,0,1024,1024);
if($('#guide').checked){ctx.strokeStyle='#82a794';ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(0,942);ctx.lineTo(1024,942);ctx.stroke();ctx.setLineDash([])}
for(const n of [128,256])$('#small'+n).getContext('2d').drawImage($('#view'),0,0,n,n);
const ds=durations();$('#label').textContent=g.key+' · '+String(index+1).padStart(2,'0')+'/'+g.frames.length;
$('#info').textContent=ds[index].toFixed(1)+' ms/当前帧，整段 '+Math.round(ds.reduce((a,b)=>a+b,0))+' ms；'+(im?.complete&&im.naturalWidth?'已载入':'载入中')+(g.phases?.[index]?'；'+g.phases[index]:'');$('#frame').value=index;$('#png').href=g.frames[index]||'#';document.querySelectorAll('#strip button').forEach((b,i)=>b.classList.toggle('current',i===index))}
function load(){g=data.find(x=>x.key===$('#group').value);images=g.frames.map(src=>{if(!src)return null;const im=new Image();im.onload=show;im.src=src;return im});index=0;elapsed=0;$('#frame').max=g.frames.length-1;$('#contact').href=g.key.replace('/','-')+'-contact.png';$('#strip').replaceChildren();g.frames.forEach((src,i)=>{const b=document.createElement('button');if(src){const im=document.createElement('img');im.src=src;b.append(im)}b.append(document.createTextNode(String(i+1).padStart(2,'0')));b.onclick=()=>{playing=false;$('#play').textContent='播放';index=i;elapsed=0;show()};$('#strip').append(b)});show()}
$('#group').onchange=load;for(const id of ['bg','guide'])$('#'+id).onchange=()=>{elapsed=0;show()};$('#play').onclick=()=>{playing=!playing;$('#play').textContent=playing?'暂停':'播放'};
function step(d){playing=false;$('#play').textContent='播放';index=(index+d+g.frames.length)%g.frames.length;elapsed=0;show()}$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);$('#frame').oninput=()=>{playing=false;$('#play').textContent='播放';index=Number($('#frame').value);elapsed=0;show()};
function tick(t){const dt=Math.min(t-last,200);last=t;if(playing){elapsed+=dt*Number($('#speed').value);const ds=durations();let changed=false;while(elapsed>=ds[index]){elapsed-=ds[index];index=(index+1)%g.frames.length;changed=true}if(changed)show()}requestAnimationFrame(tick)}load();requestAnimationFrame(tick);
</script></html>
