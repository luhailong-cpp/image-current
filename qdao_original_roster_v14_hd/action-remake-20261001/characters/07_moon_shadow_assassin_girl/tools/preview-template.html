<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>月影少女 · 动作验收</title>
<style>
[hidden]{display:none!important}
*{box-sizing:border-box}body{margin:0;background:#f4efdf;color:#263f3a;font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1140px;margin:auto;padding:24px}h1{font-size:25px;margin:0 0 4px}.note{color:#675e48;margin:8px 0 16px}section{border:1px solid #c5b383;border-radius:15px;background:#fffaf0;padding:16px;box-shadow:0 4px 14px #243d3410}.layout{display:grid;grid-template-columns:minmax(320px,1fr) 300px;gap:18px}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}button,select{font:inherit;border:1px solid #bdac7f;border-radius:8px;padding:7px 11px;color:#244c40;background:#faf6e8;cursor:pointer}button.on{background:#27594b;color:#fff5dd}button:disabled{opacity:.45;cursor:default}label{display:inline-flex;align-items:center;gap:5px}.stage{position:relative;width:100%;aspect-ratio:1;overflow:hidden;border:1px solid #b6b6ae;border-radius:8px}.checker{background:repeating-conic-gradient(#ddd 0% 25%,#f9f9f9 0% 50%) 0/32px 32px}.stage img{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.root{position:absolute;display:none;width:20px;height:20px;transform:translate(-50%,-50%);pointer-events:none;color:#ff426d}.root:before,.root:after{content:"";position:absolute;background:currentColor}.root:before{height:1px;width:20px;top:10px}.root:after{width:1px;height:20px;left:10px}.empty{display:grid;height:100%;place-items:center;color:#54625d;text-align:center;padding:30px}.timeline{width:100%;margin:14px 0 3px}dl{margin:0}dt{font-weight:600;margin-top:12px}dd{margin:3px 0;overflow-wrap:anywhere}small{color:#6d725f}.groups{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.groups button{padding:6px;font-size:13px}.progress{font-variant-numeric:tabular-nums}.error{color:#a2293e}#counter{font-variant-numeric:tabular-nums;min-width:100px}.contact{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}.contact button{padding:2px}.contact img{width:100%;display:block}.contact .current{outline:2px solid #28684e}.contact small{display:block}@media(max-width:800px){main{padding:12px}.layout{grid-template-columns:1fr}.contact{grid-template-columns:repeat(6,1fr)}}
.stage{width:min(100%,55vh);margin-inline:auto}main{padding-top:12px}.layout>section:first-child{min-width:0}.contact img{aspect-ratio:1;object-fit:contain}
</style>
<main><h1>月影少女 · 动作验收</h1><p class="note" id="summary"></p>
<div class="layout"><section><div class="controls"><label>动作 <select id="action"></select></label><label>方向 <select id="direction"></select></label><label>背景 <select id="background"><option value="checker">透明棋盘</option><option value="#fff">白</option><option value="#141920">深色</option><option value="#de29ae">品红</option></select></label><label><input type="checkbox" id="rootToggle">根点 / 接地诊断线</label></div>
<div class="controls"><span id="runTiming">跑步 · 960ms / 圈 · 60ms / 帧</span><label>显示尺寸 <select id="displaySize"><option value="large">放大检查</option><option value="160">160px</option><option value="256" selected>256px</option></select></label></div>
<div class="stage checker" id="stage"><div class="empty" id="empty">当前组尚无真实帧</div><img id="sprite" alt="月影少女动作帧" hidden><div class="root" id="root"></div><div id="ground" style="display:none;position:absolute;left:0;right:0;top:94%;border-top:1px dashed #e33;pointer-events:none"></div></div>
<div class="controls" style="margin-top:14px"><button id="play">播放</button><button id="prev">← 前帧</button><button id="next">后帧 →</button><select id="speed" aria-label="播放速度"><option value="1">正常速度</option><option value="0.25">慢速 ¼</option></select><label><input id="loop" type="checkbox" checked>循环</label><span id="counter"></span></div><input class="timeline" id="timeline" aria-label="逐帧滑块" type="range" min="0" max="0" value="0"><p id="frameInfo"></p><div class="contact" id="contact"></div></section>
<section><strong>真实进度</strong><p id="progress" class="progress"></p><div id="groups" class="groups"></div><dl><dt>当前帧文件</dt><dd id="path">—</dd><dt>视觉状态</dt><dd id="visual">—</dd><dt>命中 / 释放标记</dt><dd id="events">—</dd><dt>统一注册</dt><dd id="registration">—</dd></dl><p class="note">空槽位没有占位图。仅真实帧可播放；不完整片段无法代表完整动作循环。本页为离线动作复核；尚未接入客户端检查位移与滑步。</p><small>预览固定显示整张画布，不做包围盒缩放或最低脚贴地。← / → 逐帧；空格播放或暂停。客户端接入状态以交接文档为准。</small></section></div></main>
<script id="manifest" type="application/json">__MANIFEST_DATA__</script>
<script>
const m=JSON.parse(document.getElementById('manifest').textContent),$=id=>document.getElementById(id);
$('runTiming').textContent=`跑步 · ${m.timing?.runCycleMs??960}ms / 圈 · ${m.timing?.runFrameMs??60}ms / 帧`;
const specs={run:{name:'跑步',n:16,dirs:['N','NE','E','SE','S','SW','W','NW'],ms:m.timing?.runFrameMs??60},hit:{name:'受击',n:6,dirs:['E','W'],ms:40},attack:{name:'普攻',n:12,dirs:['E','W'],ms:30},cast:{name:'施法',n:16,dirs:['E','W'],ms:45}};
let frames=[],at=0,playing=false,timer=null,images=new Map();
const frameURL=f=>{const url=new URL('../'+f.path,location.href);url.searchParams.set('v',f.sha256);return url.href};
for(const f of m.frames){let image=new Image();image.src=frameURL(f);images.set(f.path,image)}
$('summary').textContent='本机重新制作 · 只读载入 manifest.json 的真实文件 · '+(m.characterId||'07_moon_shadow_assassin_girl');
$('progress').textContent=`已列入 ${m.frames.length} / 196 帧；视觉通过 ${m.frames.filter(f=>f.visualApproved===true).length}；正式导出 ${m.frames.filter(f=>f.status==='exported').length}。`;
for(const [key,s] of Object.entries(specs)){let o=new Option(s.name,key);$('action').add(o);for(const d of s.dirs){let b=document.createElement('button');b.textContent=`${s.name} ${d} ${m.frames.filter(f=>f.action===key&&f.direction===d).length}/${s.n}`;b.onclick=()=>{$('action').value=key;setDirections(d)};$('groups').append(b)}}
function pause(){playing=false;clearTimeout(timer);$('play').textContent='播放';$('play').classList.remove('on')}
function render(){let f=frames[at];$('empty').hidden=!!f;$('sprite').hidden=!f;for(const id of ['play','prev','next','timeline'])$(id).disabled=!f;$('timeline').max=Math.max(0,frames.length-1);$('timeline').value=at;if(!f){$('counter').textContent='0 帧';$('path').textContent='当前组无真实帧';$('frameInfo').textContent='';$('visual').textContent='尚未制作';$('events').textContent='—';return}
 $('sprite').src=frameURL(f);$('counter').textContent=`${at+1} / ${frames.length}`;$('path').textContent=f.path;$('visual').textContent=(f.visualApproved===true?'离线视觉复核通过':'待视觉复核')+' · '+(f.status||'未标记');$('events').textContent=(f.events||[]).map(e=>typeof e==='string'?e:JSON.stringify(e)).join('，')||'无';$('frameInfo').textContent=`槽位 ${f.index} · ${frameDuration(f)} ms${f.action==='run'?'（均匀交付节奏）':''} · 本组 ${frames.length}/${specs[f.action].n} 帧`;
 [...$('contact').children].forEach((b,i)=>b.classList.toggle('current',i===at));}
function frameDuration(f){return f.durationMs??specs[f.action].ms;}
function tick(){if(!playing)return;let f=frames[at];timer=setTimeout(()=>{if(at===frames.length-1&&!$('loop').checked){pause();return}at=(at+1)%frames.length;render();tick()},frameDuration(f)/Number($('speed').value))}
function startPlayback(){if(!frames.length)return;if(!$('loop').checked)at=0;playing=true;$('play').textContent='暂停';$('play').classList.add('on');render();tick()}
function selectGroup(){pause();at=0;frames=m.frames.filter(f=>f.action===$('action').value&&f.direction===$('direction').value).sort((a,b)=>a.index-b.index);$('contact').replaceChildren();frames.forEach((f,i)=>{let b=document.createElement('button'),img=document.createElement('img'),label=document.createElement('small');img.src=frameURL(f);img.alt=`${f.action}/${f.direction}/${f.index}`;label.textContent=`${f.index}`;b.append(img,label);b.onclick=()=>{pause();at=i;render()};$('contact').append(b)});render()}
function setDirections(preferred){$('direction').replaceChildren(...specs[$('action').value].dirs.map(d=>new Option(d,d)));if(preferred&&specs[$('action').value].dirs.includes(preferred))$('direction').value=preferred;selectGroup()}
$('action').onchange=()=>setDirections();$('direction').onchange=selectGroup;$('play').onclick=()=>{if(playing){pause();return}startPlayback()};
function step(n){pause();if(frames.length){at=(at+n+frames.length)%frames.length;render()}}$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('timeline').oninput=()=>{pause();at=Number($('timeline').value);render()};$('speed').onchange=()=>{if(playing){clearTimeout(timer);tick()}};
$('background').onchange=()=>{const v=$('background').value;$('stage').classList.toggle('checker',v==='checker');$('stage').style.backgroundColor=v==='checker'?'':v};
const anchor=m.registration?.rootAnchor;$('registration').textContent=JSON.stringify(m.registration||{});if(Array.isArray(anchor)){$('root').style.left=(anchor[0]/1024*100)+'%';$('root').style.top=(anchor[1]/1024*100)+'%'};$('rootToggle').onchange=()=>{$('root').style.display=$('rootToggle').checked&&Array.isArray(anchor)?'block':'none'};
$('sprite').onerror=()=>{$('frameInfo').textContent='图片加载失败：'+(frames[at]?.path||'');$('frameInfo').classList.add('error')};$('sprite').onload=()=>{$('frameInfo').classList.remove('error')};document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();if(frames.length)$('play').click()}if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});
const initial=m.frames.find(f=>f.action==='run'&&f.direction==='E')||m.frames.find(f=>specs[f.action]);if(initial){$('action').value=initial.action;setDirections(initial.direction)}else setDirections();
$('displaySize').onchange=()=>{$('stage').style.width=$('displaySize').value==='large'?'min(100%,55vh)':$('displaySize').value+'px'};
$('displaySize').onchange();
$('rootToggle').addEventListener('change',()=>{$('ground').style.display=$('rootToggle').checked?'block':'none';$('ground').style.top=(anchor[1]/1024*100)+'%'});
</script></html>
