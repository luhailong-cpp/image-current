<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>赤枪少女动作检查</title><style>body{margin:0;background:#172a27;color:#f7f1dd;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}button,select{font:inherit;padding:8px;margin:5px}button:disabled{opacity:.5}canvas{background:#e9e8e1;width:256px;height:256px;max-width:100%}.large canvas{width:512px;height:512px}.small canvas{width:128px;height:128px}.stage{display:flex;gap:24px;flex-wrap:wrap}.notes{max-width:480px;line-height:1.7}.warn{color:#ffd199}a{color:#b8dfc6}</style>
<main><h1>赤枪少女 · 动作检查</h1><p class="warn">正在参照已确认的弓足少女逐向修正，图片仍在复查。</p>
<select id="group"></select><button id="play">暂停</button><button id="restart">从头播放</button><button id="prev">上一帧</button><button id="next">下一帧</button><br>
<select id="size"><option value="normal">256px 常规</option><option value="small">128px</option><option value="large">512px 放大</option></select><select id="speed"><option value="1">正常1×</option><option value="4">慢放¼</option></select><button id="ground">隐藏地线</button><button id="bg">切换底色</button>
<div id="stage" class="stage"><canvas id="cv" width="1024" height="1024"></canvas><div class="notes"><p id="label"></p><p id="timing"></p><p id="count"></p><p>跑步：16帧 × 75ms = 1200ms。首尾不额外停顿。缺帧方向禁播整圈，可逐槽检查。</p><small>受击40ms/帧、普攻30ms/帧、施法45ms/帧。固定方向配准，不逐帧按最低脚贴线。地线只供检查；离线预览不等于客户端验收。</small></div></div><p><a href="index.html">全部动作</a> · <a href="timing-grounding.html">八方向跑步</a></p></main>
<script>
const DATA=__DATA__,onlyRun=__RUN_ONLY__;
const group=document.querySelector('#group'),cv=document.querySelector('#cv'),ctx=cv.getContext('2d'),play=document.querySelector('#play');
Object.keys(DATA.groups).filter(k=>!onlyRun||k.startsWith('run/')).sort().forEach(k=>group.add(new Option(k,k)));if(DATA.groups['run/S'])group.value='run/S';
let slots=[],images=[],index=0,playing=false,elapsed=0,last=performance.now(),ground=true,dark=false;
function frameMs(){return group.value.startsWith('run/')?75:group.value.startsWith('hit/')?40:group.value.startsWith('attack/')?30:45}
function expected(){return group.value.startsWith('hit/')?6:group.value.startsWith('attack/')?12:16}
function complete(){return slots.length===expected()&&slots.every(Boolean)}
function draw(){ctx.fillStyle=dark?'#27332f':'#e9e8e1';ctx.fillRect(0,0,1024,1024);const f=slots[index],im=images[index];if(f&&im?.complete&&im.naturalWidth)ctx.drawImage(im,0,0,1024,1024);else if(!f){ctx.fillStyle='#284738';ctx.font='48px system-ui';ctx.textAlign='center';ctx.fillText('缺少第 '+(index+1)+' 时间槽',512,450)}if(ground){ctx.strokeStyle='#76958a';ctx.lineWidth=2;ctx.setLineDash([12,10]);ctx.beginPath();ctx.moveTo(0,942);ctx.lineTo(1024,942);ctx.stroke();ctx.setLineDash([])}
document.querySelector('#label').textContent=group.value+' · 播放位 '+(index+1)+'/'+slots.length+(f?' · 来源帧 '+String(f.sourceFrame??f.frame).padStart(2,'0')+' · '+(f.candidateUrl?'1024固定配准':'原生待配准'):' · 缺帧');
document.querySelector('#timing').textContent=slots.length+' 帧 × '+frameMs()+'ms = '+slots.length*frameMs()+'ms / 圈'+(document.querySelector('#speed').value==='4'?'（慢放¼）':'（正常1×）')}
function setPlaying(v){playing=Boolean(v)&&complete();last=performance.now();play.textContent=playing?'暂停':'播放';play.disabled=!complete()}
function load(){const rows=DATA.groups[group.value]||[],n=expected(),order=DATA.orders?.[group.value]||Array.from({length:n},(_,i)=>i+1);slots=order.map(i=>rows.find(f=>f.frame===i)||null);images=slots.map(f=>{if(!f)return null;const im=new Image();im.src=f.candidateUrl||f.url;im.onload=draw;return im});index=0;elapsed=0;
document.querySelector('#count').textContent=complete()?'当前组 '+n+'/'+n+' 张独立帧，完整循环。':'当前组 '+rows.length+'/'+n+'，缺少来源帧 '+Array.from({length:n},(_,i)=>i+1).filter(i=>!rows.some(f=>f.frame===i)).join('、')+'；整圈播放已禁用。';setPlaying(complete());draw()}
function step(d){setPlaying(false);index=(index+d+slots.length)%slots.length;elapsed=index*frameMs();draw()}
group.onchange=load;play.onclick=()=>setPlaying(!playing);document.querySelector('#restart').onclick=()=>{index=0;elapsed=0;setPlaying(true);draw()};document.querySelector('#prev').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);document.querySelector('#speed').onchange=()=>{last=performance.now();draw()};document.querySelector('#size').onchange=e=>document.querySelector('#stage').className='stage '+e.target.value;document.querySelector('#ground').onclick=e=>{ground=!ground;e.target.textContent=ground?'隐藏地线':'显示地线';draw()};document.querySelector('#bg').onclick=()=>{dark=!dark;draw()};
function tick(now){if(playing){elapsed+=(now-last)/Number(document.querySelector('#speed').value);index=Math.floor(elapsed/frameMs())%slots.length;draw()}last=now;requestAnimationFrame(tick)}load();requestAnimationFrame(tick);
</script></html>
