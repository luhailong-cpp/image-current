<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>14 跑步节奏与接地</title>
<style>body{background:#eef2ef;color:#264b43;font:16px system-ui;margin:24px}header,.bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap}button,select{padding:8px;font:inherit}main{display:flex;gap:24px;margin:24px 0}.stage{position:relative;width:240px;height:240px;background:#28343f}.stage img{width:100%;height:100%}.ground{position:absolute;top:91.9921875%;border-top:1px dashed #caaf79;width:100%}.large .stage{width:480px;height:480px}.label{margin:10px 0}input[type=range]{width:360px}</style>
<header><h2 id="timingTitle">14 唤雪少女 · 跑步节奏</h2><label>方向 <select id="direction"><option>E</option><option>W</option><option>N</option><option>NE</option><option>NW</option><option>S</option><option>SE</option><option>SW</option></select></label><button id="play" disabled>播放</button><button id="reset" disabled>从第1帧播放</button><label><input id="large" type="checkbox">放大检查</label><label><input id="ground" type="checkbox" checked>地面参考线</label></header>
<p id="timingDescription">正在读取跑步时长配置…</p>
<main><section><strong id="normalTitle">正常1×</strong><div class="stage"><img id="im0" alt="正常跑步"><div class="ground"></div></div><p class="label" id="label0"></p></section><section><strong id="slowTitle">¼慢放</strong><div class="stage"><img id="im1" alt="四分之一慢放"><div class="ground"></div></div><p class="label" id="label1"></p></section></main>
<div class="bar"><button id="prev" disabled>上一帧</button><input id="frame" aria-label="同步逐帧" type="range" min="1" max="16" value="1" disabled><button id="next" disabled>下一帧</button><output id="count">01/16</output></div><p id="status">加载中…</p><p>手脚仍按竹弓少女重新复核；播放参数不等于美术验收。未运行游戏客户端。</p><a href="index.html">完整动作</a> · <a href="all-directions.html">八方向</a> · <a href="bamboo-reference.html">竹弓少女对照</a>
<script>
const $=id=>document.getElementById(id);let frames=[],ready=false,playing=false,elapsed=0,last=null,offsets=[0,0],selected=0,version=0,frameMs=0,cycleMs=0;
function draw(ns){if(!ready)return;ns.forEach((n,i)=>{$('im'+i).src=frames[n].src;$('label'+i).textContent=String(n+1).padStart(2,'0')+'/16 · '+(i===0?frameMs:frameMs*4)+'ms/帧'});selected=ns[0];$('frame').value=selected+1;$('count').textContent=String(selected+1).padStart(2,'0')+'/16'}
function drawTime(){draw([Math.floor((offsets[0]+elapsed)%cycleMs/frameMs),Math.floor((offsets[1]+elapsed)%(cycleMs*4)/(frameMs*4))])}
function stop(){playing=false;$('play').textContent='播放'}
function play(){if(!ready)return;playing=true;$('play').textContent='暂停'}
function inspect(n){if(!ready)return;stop();selected=(n+16)%16;elapsed=0;offsets=[selected*frameMs,selected*frameMs*4];draw([selected,selected])}
function reset(){stop();elapsed=0;offsets=[0,0];if(ready){draw([0,0]);play()}}
async function load(){const v=++version;stop();ready=false;elapsed=0;offsets=[0,0];['play','reset','prev','next','frame'].forEach(id=>$(id).disabled=true);$('status').textContent='加载16张正式帧…';try{const m=await(await fetch('manifest.json?v='+Date.now())).json();const d=$('direction').value,g=m.frames.filter(f=>f.action==='run'&&f.direction===d).sort((a,b)=>a.frame-b.frame);frameMs=m.runTiming.frameDurationMs;cycleMs=m.runTiming.defaultCycleMs;if(g.length!==16||g.some(f=>f.durationMs!==frameMs)||cycleMs!==frameMs*16)throw Error('时长清单与统一配置不一致');$('timingTitle').textContent='14 唤雪少女 · '+cycleMs+'ms跑步';$('timingDescription').textContent='正常1×：一圈'+(cycleMs/1000)+'秒，16帧各'+frameMs+'毫秒。右侧¼慢放用于检查手脚，单帧'+(frameMs*4)+'毫秒。暂停后两侧同步逐帧。';$('normalTitle').textContent='正常1× · '+cycleMs+'ms/圈';$('slowTitle').textContent='¼慢放 · '+cycleMs*4+'ms/圈';const arr=await Promise.all(g.map(async f=>{const im=new Image;im.src=f.path+'?sha='+f.sha256;await im.decode();return im}));if(v!==version)return;frames=arr;ready=true;['play','reset','prev','next','frame'].forEach(id=>$(id).disabled=false);$('status').textContent=d+'方向16帧已加载 · '+frameMs+'ms × 16 = '+cycleMs+'ms';reset()}catch(e){if(v===version)$('status').textContent=e.message}}
function tick(t){if(last!==null&&playing)elapsed+=t-last;last=t;if(ready&&playing)drawTime();requestAnimationFrame(tick)}
$('direction').onchange=load;$('play').onclick=()=>playing?stop():play();$('reset').onclick=reset;$('prev').onclick=()=>inspect(selected-1);$('next').onclick=()=>inspect(selected+1);$('frame').oninput=e=>inspect(Number(e.target.value)-1);$('large').onchange=e=>document.body.classList.toggle('large',e.target.checked);$('ground').onchange=e=>document.querySelectorAll('.ground').forEach(x=>x.hidden=!e.target.checked);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});requestAnimationFrame(tick);load();
</script></html>
