<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>竹弓少女动作对照</title>
<style>body{font:16px system-ui;background:#eef1ee;color:#29423b;margin:24px}header{display:flex;gap:15px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:7px}main{display:flex;gap:24px;margin-top:15px}.stage{width:480px;height:480px;background:#29303b}img{width:100%;height:100%;object-fit:contain}.small .stage{width:240px;height:240px}input[type=range]{width:400px}p{max-width:1000px}</style>
<header><h2>跑步动作对照</h2><label>方向 <select id="direction"><option>N</option><option>NE</option><option selected>E</option><option>SE</option><option>S</option><option>SW</option><option>W</option><option>NW</option></select></label><button id="play">播放</button><button id="prev">上一帧</button><button id="next">下一帧</button><label>速度 <select id="speed"><option value="1">正常</option><option value=".25">¼慢速</option></select></label><label><input id="small" type="checkbox">游戏尺寸240px</label></header>
<p>左侧为用户认可的09竹弓少女当前参考，右侧为14唤雪少女当前正式帧。<span id="timingNote">正在读取统一播放时长。</span>同帧编号不保证相同支撑腿，请按实际动作比较。保留各自原画布比例。</p>
<main><section><h3>09 竹弓少女 · 只读参考</h3><div class="stage"><img id="ref" alt="竹弓少女跑步"></div><p id="refLabel"></p></section><section><h3>14 唤雪少女 · 本轮修正</h3><div class="stage"><img id="target" alt="唤雪少女跑步"></div><p id="targetLabel"></p></section></main>
<input id="seek" type="range" min="0" max="15" value="0"><output id="count">01/16</output><p id="status">正在加载…</p>
<script>
const $=id=>document.getElementById(id);let running=false,elapsed=0,last=null,images=[],version=0,timing={},hashes={};
Promise.all([fetch('run-timing.json').then(r=>r.json()),fetch('manifest.json').then(r=>r.json())]).then(([t,m])=>{timing=t;$('timingNote').textContent='两组在本页均以'+t.defaultCycleMs+'ms/圈、'+t.frameDurationMs+'ms/帧播放；';hashes=Object.fromEntries(m.frames.map(f=>[f.path,f.sha256]));load()});
async function load(){const v=++version,d=$('direction').value;running=false;$('play').textContent='播放';elapsed=0;images=[];$('status').textContent='正在加载…';const groups=[Array.from({length:16},(_,i)=>'../09_bamboo_archer_girl/runtime/run/'+d+'/'+String(i+1).padStart(2,'0')+'.png'),Array.from({length:16},(_,i)=>'run/'+d+'/'+String(i+1).padStart(2,'0')+'.png')];const decoded=await Promise.all(groups.map(g=>Promise.all(g.map(async src=>{const im=new Image;im.src=src+(hashes[src]?'?v='+hashes[src]:'');await im.decode();return im}))));if(v!==version)return;images=decoded;$('status').textContent='32张已加载。可逐帧与连续播放对照。';draw();}
function phase(t,durations){let n=0,rem=t%durations.reduce((sum,x)=>sum+x,0);while(n<15&&rem>=durations[n]){rem-=durations[n];n++}return n}
function draw(){if(images.length!==2)return;const d=$('direction').value,ni=phase(elapsed,Array(16).fill(timing.frameDurationMs)),nj=phase(elapsed,timing.directions[d].durationsMs);$('ref').src=images[0][ni].src;$('target').src=images[1][nj].src;$('refLabel').textContent=d+' '+String(ni+1).padStart(2,'0')+'/16';$('targetLabel').textContent=d+' '+String(nj+1).padStart(2,'0')+'/16';$('seek').value=ni;$('count').textContent=String(ni+1).padStart(2,'0')+'/16';}
function seek(n){running=false;$('play').textContent='播放';elapsed=((n+16)%16)*timing.frameDurationMs;draw()}
$('direction').onchange=load;$('play').onclick=()=>{running=!running;$('play').textContent=running?'暂停':'播放'};$('prev').onclick=()=>seek(Number($('seek').value)-1);$('next').onclick=()=>seek(Number($('seek').value)+1);$('seek').oninput=e=>seek(Number(e.target.value));$('small').onchange=e=>document.body.classList.toggle('small',e.target.checked);
function tick(t){if(last!==null&&running)elapsed+=(t-last)*Number($('speed').value);last=t;draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
